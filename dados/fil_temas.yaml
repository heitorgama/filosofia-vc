# Taxonomia de temas para classificar as questões de Filosofia do Enem por
# assunto específico.
#
# É uma árvore: cada nó tem um `codigo` e um `nome`, e nós intermediários têm
# uma lista `temas` de filhos. Os nós SEM `temas` são as FOLHAS da árvore —
# são as únicas que devem ser usadas para classificar uma questão. Os nós
# intermediários (ex.: moderna) existem só para organizar a árvore e nunca
# são atribuídos diretamente a uma questão.
#
# Não há um código de topo para "Filosofia": esta taxonomia já é exclusiva
# de questões de Filosofia (é a mesma matéria `fil` de `materias.yaml`), por
# isso os códigos começam direto no período/bloco temático (ex.: moderna,
# moderna.contratualismo), sem prefixo repetido.
#
# Uma questão pode receber mais de uma folha, quando seu texto-base ou
# enunciado articula mais de um tema — por exemplo, moderna.contratualismo e
# moderna.iluminismo, ou contemporanea.poder_biopolitica e
# contemporanea.justica_democracia.
#
# Essa árvore é complementar à lista `materias.yaml`: `materias` indica a(s)
# grande(s) área(s) da questão (ex.: fil, his), enquanto esta taxonomia
# indica o(s) tema(s) específico(s) dentro da Filosofia. É complementar
# também a `fil_areas.yaml` (área sistemática) e `fil_filosofos.yaml`
# (filósofo citado ou tratado).
#
# Este arquivo é declarado em `materias.yaml`, na chave `classificacao` da
# matéria `fil` (Filosofia).

- codigo: origens
  nome: Origens da filosofia
  temas:
    - codigo: origens.mito_razao
      nome: Passagem do pensamento mítico ao lógos
    - codigo: origens.pre_socraticos
      nome: Pré-socráticos, filosofia da natureza e origens da metafísica (arché, physis, devir, ser)

- codigo: classica
  nome: Filosofia clássica
  temas:
    - codigo: classica.socrates_sofistas
      nome: Sócrates, sofistas e o nascimento da ética
    - codigo: classica.platao
      nome: Platão (metafísica das formas/ideias, política, alma)
    - codigo: classica.aristoteles
      nome: Aristóteles (lógica, física, ética, política)

- codigo: helenistica
  nome: Filosofias helenísticas
  temas:
    - codigo: helenistica.estoicismo
      nome: Estoicismo
    - codigo: helenistica.epicurismo
      nome: Epicurismo
    - codigo: helenistica.ceticismo
      nome: Ceticismo

- codigo: medieval
  nome: Filosofia medieval
  temas:
    - codigo: medieval.fe_razao
      nome: Relação entre fé e razão
    - codigo: medieval.patristica
      nome: Patrística (Agostinho)
    - codigo: medieval.escolastica
      nome: Escolástica (Tomás de Aquino)

- codigo: moderna
  nome: Filosofia moderna
  temas:
    - codigo: moderna.metodo_metafisica
      nome: Método e metafísica racionalista (dúvida cartesiana, Espinosa, Leibniz)
    - codigo: moderna.epistemologia
      nome: Teoria do conhecimento (empirismo de Bacon e Hume, racionalismo, criticismo kantiano)
    - codigo: moderna.contratualismo
      nome: Contratualismo e Estado (Hobbes, Locke, Rousseau)
    - codigo: moderna.realismo_politico
      nome: Realismo político (Maquiavel)
    - codigo: moderna.iluminismo
      nome: Iluminismo e crítica ao Antigo Regime
    - codigo: moderna.etica
      nome: Ética moderna (utilitarismo, deontologia kantiana)
    - codigo: moderna.mente_corpo
      nome: Dualismo mente-corpo e filosofia da mente (Descartes)
    - codigo: moderna.filosofia_religiao
      nome: Deus e filosofia da religião na modernidade (provas racionais, crítica)
    - codigo: moderna.filosofia_ciencia
      nome: Revolução Científica e filosofia da ciência (Galileu, método científico)
    - codigo: moderna.idealismo_alemao
      nome: Idealismo alemão e dialética (Hegel)
    - codigo: moderna.pessimismo_schopenhauer
      nome: Pessimismo metafísico e crítica à razão (Schopenhauer)

- codigo: contemporanea
  nome: Filosofia contemporânea
  temas:
    - codigo: contemporanea.existencialismo
      nome: Existencialismo e filosofia da existência (Sartre, Heidegger)
    - codigo: contemporanea.fenomenologia
      nome: Fenomenologia e filosofia da percepção
    - codigo: contemporanea.marxismo_critica
      nome: Marxismo e teoria crítica (Escola de Frankfurt, indústria cultural)
    - codigo: contemporanea.nietzsche_critica_valores
      nome: Nietzsche, crítica aos valores morais e metafísicos, morte de Deus
    - codigo: contemporanea.freud_inconsciente
      nome: Freud e a descoberta do inconsciente (psicanálise)
    - codigo: contemporanea.poder_biopolitica
      nome: Poder, disciplina, biopolítica e microfísica do poder (Foucault)
    - codigo: contemporanea.critica_sujeito
      nome: Pós-estruturalismo, pós-modernismo e crítica ao sujeito e à metafísica (Derrida, Foucault)
    - codigo: contemporanea.filosofia_analitica
      nome: Filosofia analítica e positivismo lógico (Wittgenstein, Russell, Círculo de Viena)
    - codigo: contemporanea.justica_democracia
      nome: Justiça, democracia e esfera pública (Arendt, Rawls, Habermas)
    - codigo: contemporanea.filosofias_nao_ocidentais
      nome: Filosofias não ocidentais e pensamento decolonial (ex. Ubuntu)
    - codigo: contemporanea.filosofia_linguagem
      nome: Filosofia da linguagem
    - codigo: contemporanea.estetica_arte
      nome: Estética, percepção e filosofia da arte (Merleau-Ponty, Deleuze)

- codigo: etica_moral
  nome: Ética e filosofia moral (transversal)
  temas:
    - codigo: etica_moral.teorias_normativas
      nome: Teorias éticas normativas (consequencialismo, deontologia, virtude)
    - codigo: etica_moral.relativismo
      nome: Relativismo moral e crítica sofística
    - codigo: etica_moral.bioetica
      nome: Bioética e ética aplicada

- codigo: logica_conhecimento
  nome: Lógica e método (transversal)
  temas:
    - codigo: logica_conhecimento.logica_formal
      nome: Lógica formal e silogismo (Aristóteles)
    - codigo: logica_conhecimento.inducao_deducao
      nome: Indução, dedução e método científico
    - codigo: logica_conhecimento.falacias_retorica
      nome: Falácias e retórica

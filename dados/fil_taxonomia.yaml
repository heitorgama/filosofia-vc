    nome: "Lógica e argumentação"
    temas:
      - codigo: logica.argumento
        ordem: "07.01"
        nome: "Argumento, premissas e conclusão; dedução e indução"
        relacionados: [antiga.aristoteles.logica]
      - codigo: logica.falacias

# =============================================================================
# fil_taxonomia.yaml — Taxonomia de Filosofia para classificar questões e aulas
# =============================================================================
#
# Este arquivo reúne toda a taxonomia usada para classificar questões e aulas
# da matéria `fil` (Filosofia): os três eixos descritos abaixo, cujos nomes
# são as chaves usadas no dicionário `classificacao` da questão ou aula. Ele é
# declarado em `materias.yaml`, na chave `taxonomia` da matéria `fil`.
#
# Substitui os antigos `fil_temas.yaml` (que continha só a taxonomia de
# temas), `fil_areas.yaml` e `fil_filosofos.yaml`, já removidos.
#
# -----------------------------------------------------------------------------
# 1. ESTRUTURA: TRÊS EIXOS
# -----------------------------------------------------------------------------
#
#   fil_periodos     Eixo P: quando e de quem?
#                    Formato: periodo.corrente.nucleo
#                    Raízes: antiga, medieval, moderna, sec19, contemporanea
#                    Ex.: moderna.renascimento.maquiavel
#                    Substitui a antiga taxonomia de `fil_temas` e o antigo
#                    campo `fil_filosofos`.
#
#   fil_areas        Eixo A: sobre o quê?
#                    Formato: area.subtema
#                    Raízes: etica, politica, conhecimento, ciencia, metafisica,
#                            antropologia, logica, estetica, linguagem, cultura,
#                            educacao, filosofia
#                    Ex.: politica.poder_estado
#                    Substitui o antigo campo `fil_areas` das questões (as
#                    raízes coincidem com as áreas antigas, como `politica`).
#
#   fil_habilidades  Eixo H: o que a questão pede ao aluno?
#                    Formato: um verbo. Ex.: interpretar, comparar, aplicar.
#
# Os eixos levam o prefixo `fil_` porque são exclusivos da matéria `fil`.
#
# Cada nó tem `codigo`, `ordem` e `nome`. Nós com filhos têm a lista `temas`.
#
#   codigo   identificador estável, usado nas questões. Nunca muda.
#   ordem    posição do nó para exibição, com dois dígitos por nível
#            (ex.: "03.01.02" = 3º período, 1ª corrente, 2º núcleo).
#            Serve só para ordenar listas mostradas ao usuário; ordenar por
#            este texto reproduz a ordem do arquivo, inclusive entre níveis.
#            A numeração é independente em cada eixo (fil_periodos,
#            fil_areas, fil_habilidades). Não use `ordem` para classificar
#            questões.
#
# Campos opcionais:
#   conceitos      palavras-chave que ajudam a decidir a etiqueta (eixo P)
#   relacionados   códigos P onde o tema mais aparece (eixo A)
#   descricao      o que a questão pede (eixo H)
#   aprofundamento true = autor ou tema de baixa incidência no Enem
#
# Cada código começa pelo código do nó pai. As raízes dos eixos P e A não se
# repetem, por isso todo código identifica sozinho o seu eixo.
#
# -----------------------------------------------------------------------------
# 2. COMO CLASSIFICAR UMA QUESTÃO OU AULA
# -----------------------------------------------------------------------------
#
# A questão (ou a aula) tem uma única chave `classificacao`, um dicionário.
# Para cada matéria listada em `materias`, ele pode receber os eixos da
# taxonomia dessa matéria; o valor de cada eixo é uma lista de códigos desse
# eixo. Em Filosofia:
#
#   fil_periodos     códigos do eixo P
#   fil_areas        códigos do eixo A
#   fil_habilidades  código do eixo H
#
# Regras:
#   a) Pelo menos um código em `fil_periodos`, no nível mais específico
#      possível. Use o nível de corrente (ex.: moderna.empirismo) quando não
#      houver autor central. Exceção: uma questão teórica sobre uma área da
#      filosofia em abstrato, sem menção a um autor nem a um conceito com
#      origem datada na história da filosofia, fica sem período
#      (`fil_periodos: []`).
#   b) Questões comparativas recebem até três códigos em `fil_periodos`; o
#      primeiro é o autor do texto-base.
#   c) Um ou dois códigos em `fil_areas`.
#   d) Exatamente um código em `fil_habilidades`. Em aulas, esse eixo é
#      opcional.
#   e) Um autor sem nó próprio é classificado pela corrente mais próxima.
#
# Exemplo (Enem 2010, Maquiavel):
#
#   - id: 103
#     materias: [fil]
#     classificacao:
#       fil_periodos: [moderna.renascimento.maquiavel]
#       fil_areas: [politica.poder_estado]
#       fil_habilidades: [interpretar]
#
# Antes, essa mesma questão usava:
#   fil_areas: [politica, etica]
#   fil_filosofos: [maquiavel]
#   fil_temas: [moderna.realismo_politico]
#
# -----------------------------------------------------------------------------
# 3. MIGRAÇÃO DA TAXONOMIA ANTIGA
# -----------------------------------------------------------------------------
#
# A chave `migracao`, ao final do arquivo, liga cada código do antigo campo
# `fil_temas` a um ou mais códigos novos dos eixos P e A. Ela serve de ponto de partida para
# um script de conversão.
#
# Códigos antigos amplos caem num nível genérico (ex.: moderna.racionalismo,
# etica). Essas questões devem ser revisadas e refinadas até o autor ou o
# núcleo correto. A lista `revisar` aponta os casos em que o código antigo não
# permite escolher o período sem ler a questão.
#
# Para os campos antigos:
#   fil_filosofos  troque cada filósofo pelo nó P do autor, se houver; senão,
#                  pelo nó da corrente.
#   fil_areas      troque cada área pela raiz A correspondente e, na revisão,
#                  refine para o subtema.
#
# -----------------------------------------------------------------------------
# 4. MANUTENÇÃO
# -----------------------------------------------------------------------------
#
# Códigos novos são acrescentados sem renomear os existentes, para não
# quebrar etiquetas já atribuídas. Use letras minúsculas, sem acentos, com
# palavras unidas por `_` e níveis separados por ponto.
#
# O campo `ordem`, ao contrário de `codigo`, pode ser renumerado à vontade
# para mudar a posição de exibição: questões não guardam `ordem`. Ao inserir
# um nó, dê a ele a posição desejada e renumere os irmãos seguintes. Mantenha
# sempre dois dígitos por nível e o valor entre aspas.
# =============================================================================


# =============================================================================
# EIXO P — PERÍODOS, CORRENTES E AUTORES
# =============================================================================
fil_periodos:

  - codigo: antiga
    ordem: "01"
    nome: "Filosofia Antiga (séc. VII a.C. – V d.C.)"
    temas:
      - codigo: antiga.origens
        ordem: "01.01"
        nome: "Origens da filosofia"
        temas:
          - codigo: antiga.origens.mito_logos
            ordem: "01.01.01"
            nome: "Passagem do mito ao logos"
            conceitos: "mito, logos, pólis, condições históricas do surgimento"
          - codigo: antiga.origens.atitude_filosofica
            ordem: "01.01.02"
            nome: "Filosofia e outras formas de saber"
            conceitos: "senso comum, religião, ciência, atitude filosófica, espanto (thaumázein)"
      - codigo: antiga.presocraticos
        ordem: "01.02"
        nome: "Pré-socráticos"
        temas:
          - codigo: antiga.presocraticos.jonicos
            ordem: "01.02.01"
            nome: "Escola jônica: Tales, Anaximandro, Anaxímenes"
            conceitos: "physis, arché, água, ápeiron, ar"
          - codigo: antiga.presocraticos.pitagoricos
            ordem: "01.02.02"
            nome: "Pitágoras e pitagóricos"
            conceitos: "número como princípio, harmonia, alma"
          - codigo: antiga.presocraticos.heraclito
            ordem: "01.02.03"
            nome: "Heráclito"
            conceitos: "devir, fluxo, unidade dos contrários, fogo, logos"
          - codigo: antiga.presocraticos.eleatas
            ordem: "01.02.04"
            nome: "Eleatas: Parmênides, Zenão"
            conceitos: "ser e não-ser, imobilidade, via da verdade e da opinião, paradoxos"
          - codigo: antiga.presocraticos.pluralistas
            ordem: "01.02.05"
            nome: "Pluralistas: Empédocles, Anaxágoras"
            conceitos: "quatro elementos, amor e ódio, nous"
          - codigo: antiga.presocraticos.atomistas
            ordem: "01.02.06"
            nome: "Atomistas: Leucipo, Demócrito"
            conceitos: "átomo, vazio, materialismo, necessidade"
      - codigo: antiga.socratico
        ordem: "01.03"
        nome: "Período socrático"
        temas:
          - codigo: antiga.socratico.sofistas
            ordem: "01.03.01"
            nome: "Sofistas: Protágoras, Górgias"
            conceitos: "relativismo, “homem medida”, retórica, physis × nómos"
          - codigo: antiga.socratico.socrates
            ordem: "01.03.02"
            nome: "Sócrates"
            conceitos: "ironia, maiêutica, “só sei que nada sei”, conhecimento de si, virtude como saber, julgamento e morte"
      - codigo: antiga.platao
        ordem: "01.04"
        nome: "Platão"
        temas:
          - codigo: antiga.platao.metodo
            ordem: "01.04.01"
            nome: "Platão: método e diálogos"
            conceitos: "dialética, diálogo socrático, mito filosófico"
          - codigo: antiga.platao.ideias
            ordem: "01.04.02"
            nome: "Platão: teoria das Ideias"
            conceitos: "mundo sensível × inteligível, participação, Bem"
          - codigo: antiga.platao.conhecimento
            ordem: "01.04.03"
            nome: "Platão: conhecimento"
            conceitos: "reminiscência, doxa × epistéme, linha dividida, alegoria da caverna"
          - codigo: antiga.platao.alma_etica
            ordem: "01.04.04"
            nome: "Platão: alma e ética"
            conceitos: "tripartição da alma, virtudes, justiça na alma"
          - codigo: antiga.platao.politica
            ordem: "01.04.05"
            nome: "Platão: política"
            conceitos: "República, cidade ideal, rei-filósofo, crítica à democracia"
          - codigo: antiga.platao.arte_amor
            ordem: "01.04.06"
            nome: "Platão: estética e amor"
            conceitos: "arte como mímesis, crítica aos poetas, Eros (Banquete)"
      - codigo: antiga.aristoteles
        ordem: "01.05"
        nome: "Aristóteles"
        temas:
          - codigo: antiga.aristoteles.logica
            ordem: "01.05.01"
            nome: "Aristóteles: lógica (Órganon)"
            conceitos: "silogismo, categorias, princípio de não contradição"
          - codigo: antiga.aristoteles.metafisica
            ordem: "01.05.02"
            nome: "Aristóteles: metafísica e física"
            conceitos: "substância, ato e potência, quatro causas, motor imóvel, hilemorfismo"
          - codigo: antiga.aristoteles.etica
            ordem: "01.05.03"
            nome: "Aristóteles: ética"
            conceitos: "eudaimonia, virtude como justo meio, hábito, prudência (phrónesis)"
          - codigo: antiga.aristoteles.politica
            ordem: "01.05.04"
            nome: "Aristóteles: política"
            conceitos: "animal político, formas de governo e desvios, cidadania, escravidão natural"
          - codigo: antiga.aristoteles.poetica
            ordem: "01.05.05"
            nome: "Aristóteles: poética e retórica"
            conceitos: "mímesis, tragédia, catarse, ethos/pathos/logos"
      - codigo: antiga.helenistica
        ordem: "01.06"
        nome: "Período helenístico e romano"
        temas:
          - codigo: antiga.helenistica.epicurismo
            ordem: "01.06.01"
            nome: "Epicurismo"
            conceitos: "prazer como ausência de dor (ataraxia), tetrafármaco, amizade, morte"
          - codigo: antiga.helenistica.estoicismo
            ordem: "01.06.02"
            nome: "Estoicismo: Zenão, Sêneca, Epicteto, Marco Aurélio"
            conceitos: "logos universal, viver segundo a natureza, apatheia, o que depende de nós, cosmopolitismo"
          - codigo: antiga.helenistica.ceticismo
            ordem: "01.06.03"
            nome: "Ceticismo: Pirro, Sexto Empírico"
            conceitos: "suspensão do juízo (epoché), tropos, ataraxia"
          - codigo: antiga.helenistica.cinismo
            ordem: "01.06.04"
            nome: "Cinismo: Diógenes"
            conceitos: "autarquia, vida simples, crítica às convenções"
          - codigo: antiga.helenistica.neoplatonismo
            ordem: "01.06.05"
            nome: "Neoplatonismo: Plotino"
            conceitos: "Uno, emanação, retorno da alma"
            aprofundamento: true

  - codigo: medieval
    ordem: "02"
    nome: "Filosofia Medieval (séc. II – XIV)"
    temas:
      - codigo: medieval.geral
        ordem: "02.01"
        nome: "Contexto geral da filosofia medieval"
        conceitos: "relação fé e razão, Igreja e universidades, herança greco-romana"
      - codigo: medieval.patristica
        ordem: "02.02"
        nome: "Patrística"
        temas:
          - codigo: medieval.patristica.agostinho_fe
            ordem: "02.02.01"
            nome: "Agostinho: fé e razão"
            conceitos: "“crer para compreender”, iluminação divina, interioridade"
          - codigo: medieval.patristica.agostinho_mal
            ordem: "02.02.02"
            nome: "Agostinho: mal e livre-arbítrio"
            conceitos: "mal como privação, pecado, graça, vontade"
          - codigo: medieval.patristica.agostinho_tempo
            ordem: "02.02.03"
            nome: "Agostinho: tempo e história"
            conceitos: "tempo como distensão da alma, Cidade de Deus × cidade dos homens"
          - codigo: medieval.patristica.boecio
            ordem: "02.02.04"
            nome: "Boécio"
            conceitos: "consolação da filosofia, providência, problema dos universais"
            aprofundamento: true
      - codigo: medieval.arabe_judaica
        ordem: "02.03"
        nome: "Filosofia árabe e judaica"
        temas:
          - codigo: medieval.arabe_judaica.avicena_averrois
            ordem: "02.03.01"
            nome: "Avicena, Averróis"
            conceitos: "recepção de Aristóteles, dupla verdade, intelecto"
            aprofundamento: true
          - codigo: medieval.arabe_judaica.maimonides
            ordem: "02.03.02"
            nome: "Maimônides"
            conceitos: "conciliação entre razão e revelação"
            aprofundamento: true
      - codigo: medieval.escolastica
        ordem: "02.04"
        nome: "Escolástica"
        temas:
          - codigo: medieval.escolastica.anselmo
            ordem: "02.04.01"
            nome: "Anselmo"
            conceitos: "argumento ontológico, “fé que busca compreender”"
          - codigo: medieval.escolastica.universais
            ordem: "02.04.02"
            nome: "Querela dos universais: Abelardo"
            conceitos: "realismo, nominalismo, conceitualismo"
          - codigo: medieval.escolastica.tomas_fe_razao
            ordem: "02.04.03"
            nome: "Tomás de Aquino: fé e razão"
            conceitos: "harmonia entre teologia e filosofia, aristotelismo cristão"
          - codigo: medieval.escolastica.tomas_cinco_vias
            ordem: "02.04.04"
            nome: "Tomás de Aquino: cinco vias"
            conceitos: "provas da existência de Deus, causa primeira, contingência"
          - codigo: medieval.escolastica.tomas_etica_politica
            ordem: "02.04.05"
            nome: "Tomás de Aquino: ética e política"
            conceitos: "lei eterna, natural e humana, bem comum, guerra justa"
          - codigo: medieval.escolastica.ockham
            ordem: "02.04.06"
            nome: "Guilherme de Ockham"
            conceitos: "navalha de Ockham, nominalismo, separação entre fé e razão"
          - codigo: medieval.escolastica.mistica
            ordem: "02.04.07"
            nome: "Mística e outros: Bernardo, Hildegarda de Bingen"
            conceitos: "experiência mística, presença feminina no pensamento medieval"
            aprofundamento: true

  - codigo: moderna
    ordem: "03"
    nome: "Renascimento e Filosofia Moderna (séc. XV – XVIII)"
    temas:
      - codigo: moderna.renascimento
        ordem: "03.01"
        nome: "Renascimento e humanismo"
        temas:
          - codigo: moderna.renascimento.humanismo
            ordem: "03.01.01"
            nome: "Humanismo: Pico della Mirandola, Erasmo"
            conceitos: "dignidade humana, antropocentrismo, retorno aos clássicos"
          - codigo: moderna.renascimento.maquiavel
            ordem: "03.01.02"
            nome: "Maquiavel"
            conceitos: "virtù e fortuna, autonomia da política, realismo político, “fins e meios”"
          - codigo: moderna.renascimento.montaigne
            ordem: "03.01.03"
            nome: "Montaigne"
            conceitos: "ceticismo moderno, ensaio, relativismo cultural (“Dos canibais”)"
          - codigo: moderna.renascimento.utopias
            ordem: "03.01.04"
            nome: "Utopias: Thomas More, Campanella"
            conceitos: "sociedade ideal, crítica social"
          - codigo: moderna.renascimento.reforma
            ordem: "03.01.05"
            nome: "Reforma e Contrarreforma"
            conceitos: "livre exame, autoridade, tolerância religiosa"
      - codigo: moderna.revolucao_cientifica
        ordem: "03.02"
        nome: "Revolução científica"
        temas:
          - codigo: moderna.revolucao_cientifica.galileu
            ordem: "03.02.01"
            nome: "Copérnico, Kepler, Galileu"
            conceitos: "heliocentrismo, matematização da natureza, experimento, fim do cosmos fechado"
          - codigo: moderna.revolucao_cientifica.bacon
            ordem: "03.02.02"
            nome: "Francis Bacon"
            conceitos: "método indutivo, ídolos, “saber é poder”"
          - codigo: moderna.revolucao_cientifica.newton
            ordem: "03.02.03"
            nome: "Newton"
            conceitos: "mecanicismo, leis universais, ciência moderna"
      - codigo: moderna.racionalismo
        ordem: "03.03"
        nome: "Racionalismo"
        temas:
          - codigo: moderna.racionalismo.descartes_metodo
            ordem: "03.03.01"
            nome: "Descartes: método"
            conceitos: "dúvida metódica, regras do método, evidência, clareza e distinção"
          - codigo: moderna.racionalismo.descartes_cogito
            ordem: "03.03.02"
            nome: "Descartes: cogito e substâncias"
            conceitos: "“penso, logo existo”, res cogitans × res extensa, dualismo, Deus como garantia"
          - codigo: moderna.racionalismo.espinosa
            ordem: "03.03.03"
            nome: "Espinosa"
            conceitos: "substância única, Deus ou Natureza, conatus, afetos, liberdade como compreensão da necessidade"
          - codigo: moderna.racionalismo.leibniz
            ordem: "03.03.04"
            nome: "Leibniz"
            conceitos: "mônadas, harmonia preestabelecida, melhor dos mundos possíveis"
            aprofundamento: true
          - codigo: moderna.racionalismo.pascal
            ordem: "03.03.05"
            nome: "Pascal"
            conceitos: "razões do coração, aposta, condição humana"
            aprofundamento: true
      - codigo: moderna.empirismo
        ordem: "03.04"
        nome: "Empirismo"
        temas:
          - codigo: moderna.empirismo.locke
            ordem: "03.04.01"
            nome: "Locke: conhecimento"
            conceitos: "tábula rasa, ideias simples e complexas, qualidades primárias e secundárias"
          - codigo: moderna.empirismo.berkeley
            ordem: "03.04.02"
            nome: "Berkeley"
            conceitos: "“ser é ser percebido”, imaterialismo"
            aprofundamento: true
          - codigo: moderna.empirismo.hume
            ordem: "03.04.03"
            nome: "Hume"
            conceitos: "impressões e ideias, crítica à causalidade, hábito, problema da indução, ceticismo, “é” × “deve”"
      - codigo: moderna.contratualismo
        ordem: "03.05"
        nome: "Contratualismo"
        temas:
          - codigo: moderna.contratualismo.hobbes
            ordem: "03.05.01"
            nome: "Hobbes"
            conceitos: "estado de natureza como guerra, Leviatã, soberania absoluta"
          - codigo: moderna.contratualismo.locke
            ordem: "03.05.02"
            nome: "Locke: política"
            conceitos: "direitos naturais, propriedade, governo civil, direito de resistência, liberalismo"
          - codigo: moderna.contratualismo.rousseau
            ordem: "03.05.03"
            nome: "Rousseau"
            conceitos: "bom selvagem, origem da desigualdade, vontade geral, soberania popular, educação (Emílio)"
      - codigo: moderna.iluminismo
        ordem: "03.06"
        nome: "Iluminismo"
        temas:
          - codigo: moderna.iluminismo.geral
            ordem: "03.06.01"
            nome: "Esclarecimento: ideias gerais"
            conceitos: "razão, progresso, crítica à autoridade, Enciclopédia"
          - codigo: moderna.iluminismo.montesquieu
            ordem: "03.06.02"
            nome: "Montesquieu"
            conceitos: "separação dos poderes, espírito das leis"
          - codigo: moderna.iluminismo.voltaire_diderot
            ordem: "03.06.03"
            nome: "Voltaire, Diderot"
            conceitos: "tolerância, crítica religiosa, liberdade de expressão"
          - codigo: moderna.iluminismo.wollstonecraft
            ordem: "03.06.04"
            nome: "Mary Wollstonecraft"
            conceitos: "direitos das mulheres, educação feminina"
            aprofundamento: true
      - codigo: moderna.kant
        ordem: "03.07"
        nome: "Kant"
        temas:
          - codigo: moderna.kant.esclarecimento
            ordem: "03.07.01"
            nome: "Kant: O que é Esclarecimento?"
            conceitos: "menoridade, autonomia, uso público da razão"
          - codigo: moderna.kant.conhecimento
            ordem: "03.07.02"
            nome: "Kant: teoria do conhecimento"
            conceitos: "revolução copernicana, juízos analíticos e sintéticos a priori, fenômeno × númeno, formas da sensibilidade, categorias"
          - codigo: moderna.kant.etica
            ordem: "03.07.03"
            nome: "Kant: ética"
            conceitos: "dever, imperativo categórico e hipotético, autonomia, dignidade, pessoa como fim"
          - codigo: moderna.kant.estetica_politica
            ordem: "03.07.04"
            nome: "Kant: estética e política"
            conceitos: "belo e sublime, juízo de gosto, paz perpétua"
            aprofundamento: true

  - codigo: sec19
    ordem: "04"
    nome: "Século XIX"
    temas:
      - codigo: sec19.idealismo
        ordem: "04.01"
        nome: "Idealismo alemão"
        temas:
          - codigo: sec19.idealismo.hegel
            ordem: "04.01.01"
            nome: "Hegel"
            conceitos: "dialética (tese, antítese, síntese), Espírito absoluto, razão na história, senhor e escravo, Estado"
          - codigo: sec19.idealismo.fichte_schelling
            ordem: "04.01.02"
            nome: "Fichte, Schelling"
            conceitos: "eu absoluto, filosofia da natureza, romantismo"
            aprofundamento: true
      - codigo: sec19.marxismo
        ordem: "04.02"
        nome: "Marx e marxismo"
        temas:
          - codigo: sec19.marxismo.materialismo_historico
            ordem: "04.02.01"
            nome: "Materialismo histórico-dialético"
            conceitos: "infraestrutura e superestrutura, modos de produção, luta de classes"
          - codigo: sec19.marxismo.alienacao
            ordem: "04.02.02"
            nome: "Trabalho e alienação"
            conceitos: "alienação, mais-valia, fetichismo da mercadoria"
          - codigo: sec19.marxismo.ideologia
            ordem: "04.02.03"
            nome: "Ideologia e práxis"
            conceitos: "ideologia, consciência de classe, transformação do mundo (11ª tese sobre Feuerbach)"
          - codigo: sec19.marxismo.engels
            ordem: "04.02.04"
            nome: "Engels"
            conceitos: "origem da família, da propriedade privada e do Estado"
            aprofundamento: true
      - codigo: sec19.positivismo
        ordem: "04.03"
        nome: "Positivismo"
        temas:
          - codigo: sec19.positivismo.comte
            ordem: "04.03.01"
            nome: "Comte"
            conceitos: "lei dos três estados, ciência positiva, ordem e progresso, positivismo no Brasil"
      - codigo: sec19.utilitarismo
        ordem: "04.04"
        nome: "Utilitarismo e liberalismo"
        temas:
          - codigo: sec19.utilitarismo.bentham
            ordem: "04.04.01"
            nome: "Bentham"
            conceitos: "princípio de utilidade, cálculo hedonista, panóptico"
          - codigo: sec19.utilitarismo.mill
            ordem: "04.04.02"
            nome: "John Stuart Mill"
            conceitos: "prazeres superiores, liberdade individual, princípio do dano, sujeição das mulheres"
      - codigo: sec19.critica_razao
        ordem: "04.05"
        nome: "Críticas à razão e ao sistema"
        temas:
          - codigo: sec19.critica_razao.schopenhauer
            ordem: "04.05.01"
            nome: "Schopenhauer"
            conceitos: "vontade e representação, pessimismo, sofrimento, arte como alívio"
          - codigo: sec19.critica_razao.kierkegaard
            ordem: "04.05.02"
            nome: "Kierkegaard"
            conceitos: "existência, angústia, desespero, estágios estético, ético e religioso"
          - codigo: sec19.critica_razao.nietzsche_moral
            ordem: "04.05.03"
            nome: "Nietzsche: crítica à moral"
            conceitos: "genealogia, moral de senhores e de escravos, ressentimento, transvaloração"
          - codigo: sec19.critica_razao.nietzsche_niilismo
            ordem: "04.05.04"
            nome: "Nietzsche: niilismo e vida"
            conceitos: "morte de Deus, niilismo, vontade de poder, além-do-homem, eterno retorno"
          - codigo: sec19.critica_razao.nietzsche_arte
            ordem: "04.05.05"
            nome: "Nietzsche: arte e verdade"
            conceitos: "apolíneo e dionisíaco, perspectivismo, crítica à verdade"
      - codigo: sec19.outras
        ordem: "04.06"
        nome: "Outras correntes"
        temas:
          - codigo: sec19.outras.pragmatismo
            ordem: "04.06.01"
            nome: "Pragmatismo: Peirce, William James, Dewey"
            conceitos: "verdade como utilidade, consequências práticas, educação democrática"
            aprofundamento: true
          - codigo: sec19.outras.darwinismo
            ordem: "04.06.02"
            nome: "Darwinismo e seu impacto filosófico"
            conceitos: "evolução, seleção natural, darwinismo social (crítica)"
            aprofundamento: true

  - codigo: contemporanea

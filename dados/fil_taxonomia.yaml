    nome: "Filosofia Contemporânea: séculos XX e XXI"
    temas:
      - codigo: contemporanea.psicanalise
        ordem: "05.01"
        nome: "Psicanálise e filosofia"
        temas:
          - codigo: contemporanea.psicanalise.freud
            ordem: "05.01.01"
            nome: "Freud"
            conceitos: "inconsciente, id/ego/superego, mal-estar na civilização, descentramento do sujeito"
      - codigo: contemporanea.fenomenologia
        ordem: "05.02"
        nome: "Fenomenologia e hermenêutica"
        temas:
          - codigo: contemporanea.fenomenologia.husserl
            ordem: "05.02.01"
            nome: "Husserl"
            conceitos: "intencionalidade, “voltar às coisas mesmas”, epoché fenomenológica"
          - codigo: contemporanea.fenomenologia.heidegger
            ordem: "05.02.02"
            nome: "Heidegger"
            conceitos: "ser-aí (Dasein), ser-para-a-morte, angústia, inautenticidade, técnica"
          - codigo: contemporanea.fenomenologia.merleau_ponty
            ordem: "05.02.03"
            nome: "Merleau-Ponty"
            conceitos: "corpo próprio, percepção"
            aprofundamento: true
          - codigo: contemporanea.fenomenologia.hermeneutica
            ordem: "05.02.04"
            nome: "Gadamer, Ricoeur"
            conceitos: "hermenêutica, interpretação, fusão de horizontes"
            aprofundamento: true
      - codigo: contemporanea.existencialismo
        ordem: "05.03"
        nome: "Existencialismo"
        temas:
          - codigo: contemporanea.existencialismo.sartre
            ordem: "05.03.01"
            nome: "Sartre"
            conceitos: "“a existência precede a essência”, liberdade, responsabilidade, má-fé, angústia, engajamento"
          - codigo: contemporanea.existencialismo.beauvoir
            ordem: "05.03.02"
            nome: "Simone de Beauvoir"
            conceitos: "“não se nasce mulher”, o Outro, construção social do gênero, moral da ambiguidade"
          - codigo: contemporanea.existencialismo.camus
            ordem: "05.03.03"
            nome: "Camus"
            conceitos: "absurdo, Sísifo, revolta, suicídio filosófico"
      - codigo: contemporanea.frankfurt
        ordem: "05.04"
        nome: "Escola de Frankfurt e teoria crítica"
        temas:
          - codigo: contemporanea.frankfurt.industria_cultural
            ordem: "05.04.01"
            nome: "Adorno e Horkheimer"
            conceitos: "indústria cultural, razão instrumental, dialética do esclarecimento, cultura de massa"
          - codigo: contemporanea.frankfurt.benjamin
            ordem: "05.04.02"
            nome: "Walter Benjamin"
            conceitos: "reprodutibilidade técnica, aura, filosofia da história"
          - codigo: contemporanea.frankfurt.marcuse
            ordem: "05.04.03"
            nome: "Marcuse"
            conceitos: "homem unidimensional, sociedade de consumo"
            aprofundamento: true
          - codigo: contemporanea.frankfurt.habermas
            ordem: "05.04.04"
            nome: "Habermas"
            conceitos: "razão comunicativa, ação comunicativa, esfera pública, democracia deliberativa"
          - codigo: contemporanea.frankfurt.honneth
            ordem: "05.04.05"
            nome: "Axel Honneth"
            conceitos: "luta por reconhecimento"
            aprofundamento: true
      - codigo: contemporanea.analitica
        ordem: "05.05"
        nome: "Filosofia analítica e da linguagem"
        temas:
          - codigo: contemporanea.analitica.logicismo
            ordem: "05.05.01"
            nome: "Frege, Russell"
            conceitos: "lógica simbólica, sentido e referência, atomismo lógico"
            aprofundamento: true
          - codigo: contemporanea.analitica.wittgenstein
            ordem: "05.05.02"
            nome: "Wittgenstein"
            conceitos: "Tractatus, limites da linguagem, jogos de linguagem, significado como uso"
          - codigo: contemporanea.analitica.circulo_viena
            ordem: "05.05.03"
            nome: "Círculo de Viena"
            conceitos: "positivismo lógico, verificacionismo"
          - codigo: contemporanea.analitica.atos_fala
            ordem: "05.05.04"
            nome: "Austin, Searle"
            conceitos: "atos de fala, filosofia da mente"
            aprofundamento: true
      - codigo: contemporanea.ciencia
        ordem: "05.06"
        nome: "Epistemologia da ciência"
        temas:
          - codigo: contemporanea.ciencia.popper
            ordem: "05.06.01"
            nome: "Popper"
            conceitos: "falseabilidade, demarcação, crítica ao indutivismo, sociedade aberta"
          - codigo: contemporanea.ciencia.kuhn
            ordem: "05.06.02"
            nome: "Kuhn"
            conceitos: "paradigma, ciência normal, revolução científica, incomensurabilidade"
          - codigo: contemporanea.ciencia.bachelard_feyerabend
            ordem: "05.06.03"
            nome: "Bachelard, Feyerabend"
            conceitos: "obstáculo epistemológico, ruptura, anarquismo metodológico"
            aprofundamento: true
      - codigo: contemporanea.politica
        ordem: "05.07"
        nome: "Filosofia política do século XX"
        temas:
          - codigo: contemporanea.politica.arendt
            ordem: "05.07.01"
            nome: "Hannah Arendt"
            conceitos: "totalitarismo, banalidade do mal, condição humana (labor, trabalho, ação), espaço público"
          - codigo: contemporanea.politica.rawls
            ordem: "05.07.02"
            nome: "Rawls"
            conceitos: "véu da ignorância, posição original, justiça como equidade"
          - codigo: contemporanea.politica.libertarismo_comunitarismo
            ordem: "05.07.03"
            nome: "Nozick, Sandel"
            conceitos: "libertarismo, comunitarismo, debate sobre justiça distributiva"
            aprofundamento: true
          - codigo: contemporanea.politica.berlin
            ordem: "05.07.04"
            nome: "Isaiah Berlin"
            conceitos: "liberdade negativa e positiva"
            aprofundamento: true
      - codigo: contemporanea.estruturalismo
        ordem: "05.08"
        nome: "Estruturalismo e pós-estruturalismo"
        temas:
          - codigo: contemporanea.estruturalismo.levi_strauss
            ordem: "05.08.01"
            nome: "Lévi-Strauss"
            conceitos: "estruturalismo, etnocentrismo, pensamento selvagem"
          - codigo: contemporanea.estruturalismo.foucault
            ordem: "05.08.02"
            nome: "Foucault"
            conceitos: "poder disciplinar, vigilância, biopoder, saber-poder, sociedade disciplinar"
          - codigo: contemporanea.estruturalismo.pos_modernidade
            ordem: "05.08.03"
            nome: "Deleuze, Derrida, Lyotard"
            conceitos: "diferença, desconstrução, pós-modernidade, fim das grandes narrativas"
            aprofundamento: true
          - codigo: contemporanea.estruturalismo.sociedade_atual
            ordem: "05.08.04"
            nome: "Bauman, Han"
            conceitos: "modernidade líquida, sociedade do cansaço, sociedade do desempenho"
      - codigo: contemporanea.etica_aplicada
        ordem: "05.09"
        nome: "Ética contemporânea e aplicada"
        temas:
          - codigo: contemporanea.etica_aplicada.jonas
            ordem: "05.09.01"
            nome: "Hans Jonas"
            conceitos: "princípio responsabilidade, ética para a civilização tecnológica"
          - codigo: contemporanea.etica_aplicada.singer
            ordem: "05.09.02"
            nome: "Peter Singer"
            conceitos: "especismo, ética animal, altruísmo eficaz"
          - codigo: contemporanea.etica_aplicada.levinas
            ordem: "05.09.03"
            nome: "Levinas"
            conceitos: "ética da alteridade, rosto do Outro"
            aprofundamento: true
      - codigo: contemporanea.feminismos
        ordem: "05.10"
        nome: "Feminismos e estudos de gênero"
        temas:
          - codigo: contemporanea.feminismos.butler
            ordem: "05.10.01"
            nome: "Judith Butler"
            conceitos: "performatividade de gênero"
          - codigo: contemporanea.feminismos.interseccionalidade
            ordem: "05.10.02"
            nome: "Angela Davis, bell hooks"
            conceitos: "interseccionalidade entre raça, classe e gênero"
          - codigo: contemporanea.feminismos.feminismo_negro_br
            ordem: "05.10.03"
            nome: "Lélia Gonzalez, Sueli Carneiro, Djamila Ribeiro"
            conceitos: "feminismo negro brasileiro, amefricanidade, lugar de fala, epistemicídio"
      - codigo: contemporanea.decolonial
        ordem: "05.11"
        nome: "Pensamento decolonial e filosofias não ocidentais"
        temas:
          - codigo: contemporanea.decolonial.fanon_mbembe
            ordem: "05.11.01"
            nome: "Frantz Fanon, Achille Mbembe"
            conceitos: "colonialismo, racismo, necropolítica"

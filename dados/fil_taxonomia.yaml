# =============================================================================
# EIXO H — HABILIDADES
# =============================================================================
fil_habilidades:

  - codigo: identificar
    ordem: "01"
    nome: "Identificar conceito"
    descricao: "Reconhecer a definição ou o termo correto de um autor ou corrente."
  - codigo: interpretar
    ordem: "02"
    nome: "Interpretar texto filosófico"
    descricao: "Extrair a tese de um fragmento e reconhecer sua paráfrase fiel."
  - codigo: comparar
    ordem: "03"
    nome: "Comparar autores ou correntes"
    descricao: "Apontar convergências e divergências entre posições."
  - codigo: contextualizar
    ordem: "04"
    nome: "Contextualizar historicamente"
    descricao: "Relacionar ideias ao seu período e às condições sociais em que surgiram."
  - codigo: aplicar
    ordem: "05"
    nome: "Aplicar a situação atual"
    descricao: "Usar um conceito para analisar um caso, notícia, charge ou dilema."
  - codigo: analisar_argumento
    ordem: "06"
    nome: "Analisar argumento"
    descricao: "Identificar premissas, conclusão, validade ou falácias."
  - codigo: avaliar
    ordem: "07"
    nome: "Avaliar e problematizar"
    descricao: "Julgar a força de uma posição e formular objeções."
  - codigo: dissertar
    ordem: "08"
    nome: "Argumentar por escrito"
    descricao: "Produzir texto dissertativo com posição fundamentada (questões abertas e redação)."



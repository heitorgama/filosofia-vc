            ordem: "05.11.02"
            nome: "Decolonialidade: Quijano, Dussel, Mignolo"
            conceitos: "colonialidade do poder, filosofia da libertação"
            aprofundamento: true
          - codigo: contemporanea.decolonial.africana
            ordem: "05.11.03"
            nome: "Filosofias africanas"
            conceitos: "ubuntu, tradição oral, filosofia africana como campo"
          - codigo: contemporanea.decolonial.oriental
            ordem: "05.11.04"
            nome: "Filosofias orientais"
            conceitos: "confucionismo, taoismo, budismo, pensamento indiano"
          - codigo: contemporanea.decolonial.indigena
            ordem: "05.11.05"
            nome: "Pensamento indígena"
            conceitos: "Ailton Krenak, Davi Kopenawa, perspectivismo ameríndio (Viveiros de Castro)"
      - codigo: contemporanea.brasil

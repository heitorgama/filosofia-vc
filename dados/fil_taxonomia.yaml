      - codigo: metafisica.liberdade_determinismo
        ordem: "05.04"
        nome: "Liberdade × determinismo"
        relacionados: [antiga.helenistica.estoicismo, medieval.patristica.agostinho_mal, moderna.racionalismo.espinosa, contemporanea.existencialismo.sartre]

  - codigo: antropologia
    ordem: "06"
    nome: "Antropologia filosófica e existência"
    temas:
      - codigo: antropologia.natureza_humana
        ordem: "06.01"
        nome: "Natureza humana"
        relacionados: [moderna.contratualismo.hobbes, moderna.contratualismo.rousseau, antiga.aristoteles.politica]
      - codigo: antropologia.mente_corpo
        ordem: "06.02"
        nome: "Mente, alma e corpo"
        relacionados: [antiga.platao.alma_etica, moderna.racionalismo.descartes_cogito, contemporanea.fenomenologia.merleau_ponty]
      - codigo: antropologia.existencia
        ordem: "06.03"
        nome: "Sentido da vida, angústia, morte e absurdo"
        relacionados: [antiga.helenistica.epicurismo, sec19.critica_razao.kierkegaard, contemporanea.fenomenologia.heidegger, contemporanea.existencialismo]
      - codigo: antropologia.subjetividade
        ordem: "06.04"
        nome: "Subjetividade, inconsciente e identidade"
        relacionados: [moderna.racionalismo.descartes_cogito, contemporanea.psicanalise.freud]

  - codigo: logica

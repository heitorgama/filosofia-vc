fil_areas:

  - codigo: etica
    ordem: "01"
    nome: "Ética e moral"
    temas:
      - codigo: etica.natureza
        ordem: "01.01"
        nome: "Natureza da filosofia moral (moral × ética, liberdade e responsabilidade)"
        relacionados: [antiga.socratico.socrates, contemporanea.existencialismo.sartre]
      - codigo: etica.felicidade
        ordem: "01.02"
        nome: "Felicidade e prazer (eudaimonismo, hedonismo)"
        relacionados: [antiga.aristoteles.etica, antiga.helenistica.epicurismo, antiga.helenistica.estoicismo]
      - codigo: etica.virtudes
        ordem: "01.03"
        nome: "Ética das virtudes"
        relacionados: [antiga.platao.alma_etica, antiga.aristoteles.etica]
      - codigo: etica.dever
        ordem: "01.04"
        nome: "Ética do dever (deontologia)"
        relacionados: [moderna.kant.etica]
      - codigo: etica.utilitarismo
        ordem: "01.05"
        nome: "Consequencialismo e utilitarismo"
        relacionados: [sec19.utilitarismo, contemporanea.etica_aplicada.singer]
      - codigo: etica.critica_moral
        ordem: "01.06"
        nome: "Crítica da moral e niilismo"
        relacionados: [sec19.critica_razao.nietzsche_moral, sec19.critica_razao.nietzsche_niilismo]
      - codigo: etica.aplicada
        ordem: "01.07"
        nome: "Ética aplicada (bioética, ética animal, ambiental, tecnologia e IA)"
        relacionados: [contemporanea.etica_aplicada]

  - codigo: politica
    ordem: "02"
    nome: "Filosofia política"
    temas:
      - codigo: politica.legitimidade
        ordem: "02.01"
        nome: "Origem e legitimidade do poder (contratualismo)"
        relacionados: [moderna.contratualismo]
      - codigo: politica.governo_democracia
        ordem: "02.02"
        nome: "Formas de governo e democracia"
        relacionados: [antiga.platao.politica, antiga.aristoteles.politica, moderna.iluminismo.montesquieu, contemporanea.frankfurt.habermas]
      - codigo: politica.justica
        ordem: "02.03"
        nome: "Justiça e igualdade"
        relacionados: [antiga.platao.politica, moderna.contratualismo.rousseau, contemporanea.politica.rawls, contemporanea.politica.libertarismo_comunitarismo]
      - codigo: politica.liberdade_direitos
        ordem: "02.04"
        nome: "Liberdade e direitos"
        relacionados: [moderna.contratualismo.locke, sec19.utilitarismo.mill, contemporanea.politica.berlin]
      - codigo: politica.poder_estado
        ordem: "02.05"
        nome: "Poder, Estado e violência"
        relacionados: [moderna.renascimento.maquiavel, contemporanea.politica.arendt, contemporanea.estruturalismo.foucault, contemporanea.decolonial.fanon_mbembe]
      - codigo: politica.trabalho_capital
        ordem: "02.06"
        nome: "Trabalho, classes e capitalismo"
        relacionados: [sec19.marxismo]
      - codigo: politica.totalitarismo
        ordem: "02.07"
        nome: "Totalitarismo e autoritarismo"
        relacionados: [contemporanea.politica.arendt, contemporanea.brasil.pensadores]

  - codigo: conhecimento
    ordem: "03"
    nome: "Teoria do conhecimento (epistemologia)"
    temas:
      - codigo: conhecimento.ceticismo
        ordem: "03.01"
        nome: "Possibilidade do conhecimento e ceticismo"
        relacionados: [antiga.socratico.sofistas, antiga.helenistica.ceticismo, moderna.renascimento.montaigne, moderna.empirismo.hume]
      - codigo: conhecimento.razao_experiencia
        ordem: "03.02"
        nome: "Razão × experiência (racionalismo, empirismo, criticismo)"
        relacionados: [moderna.racionalismo, moderna.empirismo, moderna.kant.conhecimento]
      - codigo: conhecimento.verdade
        ordem: "03.03"
        nome: "Verdade e opinião"
        relacionados: [antiga.platao.conhecimento, sec19.critica_razao.nietzsche_arte, sec19.outras.pragmatismo]

  - codigo: ciencia
    ordem: "04"
    nome: "Filosofia da ciência"
    temas:
      - codigo: ciencia.metodo
        ordem: "04.01"
        nome: "Método científico (indução, dedução, experimento)"
        relacionados: [moderna.revolucao_cientifica.bacon, moderna.racionalismo.descartes_metodo, contemporanea.ciencia.popper]
      - codigo: ciencia.paradigmas
        ordem: "04.02"
        nome: "Ciência, progresso e paradigmas"

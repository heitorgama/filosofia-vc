        temas:
          - codigo: contemporanea.brasil.freire
            ordem: "05.12.01"
            nome: "Paulo Freire"
            conceitos: "pedagogia do oprimido, educação bancária × libertadora, conscientização"
          - codigo: contemporanea.brasil.pensadores
            ordem: "05.12.02"
            nome: "Pensadores brasileiros"
            conceitos: "Marilena Chaui (ideologia, autoritarismo), Vilém Flusser, Sérgio Buarque (homem cordial)"



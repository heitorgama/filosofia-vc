# Normalização dos valores da chave `test` em questoes_enem.yaml.
# Cada item decompõe um código de prova (ex.: enem_2025_2apl) em:
#
#   test_class      exame (ex.: enem)
#   test_year       ano de aplicação
#   test_name       aplicação específica: 2apl (2ª aplicação), digital,
#                   belem (aplicação de Belém, remarcada por causa da COP30);
#                   null para a aplicação regular
#   test_full_name  nome por extenso, para exibição
#
# Ao cadastrar uma questão de uma prova nova, acrescente a prova aqui.


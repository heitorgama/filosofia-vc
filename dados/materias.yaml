# Lista de valores admitidos para a chave `materias` em questoes_enem.yaml.
# Cada questão deve referenciar um ou mais desses códigos (normalmente só um).
# Baseado nas áreas de conhecimento e componentes curriculares do Enem.
#
# Uma matéria pode ter uma chave opcional `taxonomia`: o nome do arquivo YAML
# (na mesma pasta deste arquivo, no padrão `<codigo>_taxonomia.yaml`) que
# classifica com mais detalhe as questões e aulas dessa matéria. Os eixos
# desse arquivo (ex.: `fil_periodos`, `fil_areas`, `fil_habilidades`) são as
# chaves que a matéria pode usar no dicionário `classificacao` da questão; o
# cabeçalho do arquivo traz as regras para preenchê-las. Uma matéria sem
# classificação própria (ex.: Matemática) simplesmente não declara `taxonomia`.
#
# Uma matéria também pode ter uma chave opcional `aulas`: o nome do arquivo
# YAML (na mesma pasta deste arquivo, no padrão `<codigo>_aulas.yaml`) que
# lista as aulas dessa matéria e as questões usadas em cada uma.

- codigo: fil
  nome: Filosofia
  taxonomia: fil_taxonomia.yaml
  aulas: fil_aulas.yaml
- codigo: soc
  nome: Sociologia
- codigo: his

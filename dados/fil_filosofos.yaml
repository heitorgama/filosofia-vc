# Lista de valores admitidos para a chave `fil_filosofos` em questoes_enem.yaml:
# o(s) filósofo(s) citado(s) ou tratado(s) pela questão (no texto-base, no
# enunciado ou nas alternativas). Uma questão normalmente recebe um filósofo,
# mas pode receber mais de um quando compara dois textos de autores
# diferentes (ex.: TEXTO I de um, TEXTO II de outro).
#
# Complementa `fil_temas.yaml` (período + assunto) e
# `fil_areas.yaml` (área sistemática): esta lista indica quem é o
# filósofo, não quando ou sobre o quê.
#
# Este arquivo é declarado em `materias.yaml`, na chave `classificacao` da
# matéria `fil` (Filosofia). Uma futura matéria cujos pensadores se
# sobrepõem à Filosofia (ex.: Sociologia) pode declarar seu próprio atributo
# apontando para este mesmo arquivo, em vez de duplicar os nomes.


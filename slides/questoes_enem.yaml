- id: 1
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 55
  question_elements:
    - question_text: >
        A alma funciona no meu corpo de maneira maravilhosa. Nele se aloja, certamente,
        mas sabe bem dele escapar: escapa para ver as coisas através da janela dos meus olhos,
        escapa para sonhar quando durmo, para sobreviver quando morro. Minha alma durará
        muito tempo e mais que muito tempo, quando meu corpo vier a apodrecer. Viva minha alma!
        É meu corpo luminoso, purificado, virtuoso, ágil, móvel, tépido, viçoso; é meu corpo liso,
        castrado, arredondado como uma bolha de sabão.
      question_text_reference: "FOUCAULT, M. **O corpo utópico, as heterotopias**. São Paulo: Edições N-1, 2013."
  statement: "Esse texto reforça uma concepção metafísica clássica que remete a um(a)"
  answers:
    A: "pressuposto lógico."
    B: "pensamento dicotômico."
    C: "contemplação da natureza."
    D: "raciocínio argumentativo."
    E: "crítica à individualidade."
  correct_answer: B
  comments:
    A: "O texto não trata de premissas ou de encadeamento lógico; é uma descrição poética da relação entre alma e corpo."
    B: "O texto separa alma e corpo como duas realidades distintas (a alma 'escapa' do corpo e sobrevive a ele), o que caracteriza o pensamento dicotômico, típico da metafísica clássica (Platão, Descartes)."
    C: "O foco está na alma e no corpo do sujeito, e não na contemplação da natureza."
    D: "Não há uma argumentação com premissas e conclusão; o trecho é descritivo e literário."
    E: "O autor não critica a individualidade: ao contrário, o eu celebra a própria alma e o próprio corpo."

- id: 2
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 58
  question_elements:
    - question_text_title: TEXTO I
      question_text: >
        Aristóteles entendia que a felicidade era diretamente ligada ao respeito pela própria natureza
        e, de certa maneira, a uma vida que tivesse na natureza de si mesma uma referência inabalável.
        Isso lhe permitiu formular o conceito de excelência. O que seria excelência? Seria, justamente,
        ao longo da vida, tirar de si mesmo, em forma de performance, de conduta, de comportamento,
        de disposição, o que a natureza permitiria de melhor.
      question_text_reference: >
        COEN, M.; BARROS FILHO, C. **A monja e o professor**: reflexões sobre ética, preceitos e valores. Rio de Janeiro: Best Seller, 2018.
    - question_text_title: TEXTO II
      question_text: >
        A noção de eudaimonia é central para a ética aristotélica. A eudaimonia é uma atividade e não
        um estado psicológico, pois é definida na Ética a Nicômaco como uma atividade da alma com base
        na virtude moral. A virtude moral é definida em termos de uma disposição diretamente ligada à
        deliberação, o que o leva a estudar a virtude intelectual que opera em seu interior, isto é, a prudência.
        A estrutura conceitual da ética aristotélica responde a uma tentativa de elucidar conceitualmente
        em que consiste isto, agir bem, ou, na linguagem aristotélica, o que significa ser feliz.
      question_text_reference: >
        ZINGANO, M. Eudaimonia, razão e contemplação na ética aristotélica. **Analytica**, n. 1, 2017 (adaptado).
  statement: >
    Os textos indicam que a prática de ações virtuosas, sempre efetivada na pólis, ocorre por meio do(a)
  answers:
    A: "teoria das formas essenciais."
    B: "identificação dos princípios racionais."
    C: "desenvolvimento das técnicas retóricas."
    D: "aperfeiçoamento das condutas humanas."
    E: "conhecimento das epistemes verdadeiras."
  correct_answer: D
  comments:
    A: "A teoria das formas essenciais é platônica; Aristóteles a critica e não a usa para explicar a prática das virtudes."
    B: "Identificar princípios racionais é uma atividade teórica; os textos falam de virtude moral e prudência, isto é, de ação prática."
    C: "As técnicas retóricas não são mencionadas nem são o meio da virtude nos textos."
    D: "Para Aristóteles, a excelência (arete) é tirar de si o melhor, por meio da deliberação e do hábito; ou seja, a virtude se realiza pelo aperfeiçoamento das condutas humanas."
    E: "As epistemes (saberes teóricos) não são a base da ação virtuosa; esta depende da prudência (phronesis), saber prático."

- id: 3
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 61
  question_elements:
    - question_text: >
        Eu sentia falta do futuro. É claro que eu sabia, muito mesmo antes da recorrência dele, que nunca envelheceria.
        Era muito provável que eu nunca mais fosse ver o oceano de uma altura de trinta mil pés de novo, uma distância
        tão grande que não dá nem para distinguir as ondas, nem nenhum barco, de um jeito que faz o oceano parecer
        um enorme e infinito monólito. Eu poderia imaginá-lo. Eu poderia me lembrar dele. Mas não poderia vê-lo de novo,
        e me ocorreu que a ambição voraz dos seres humanos nunca é saciada quando os sonhos são realizados,
        porque há sempre a sensação de que tudo poderia ter sido feito melhor e ser feito outra vez.
      question_text_reference: >
        GREEN, J. **A culpa é das estrelas**. Rio de Janeiro: Intrínseca, 2012.
  statement: >
    O texto apresenta uma reflexão da personagem acerca de um problema característico da filosofia contemporânea, que trata da(s)
  answers:
    A: "implicações éticas."
    B: "finitude humana."
    C: "limitações da linguagem."
    D: "pressuposição existencial."
    E: "objetividade do conhecimento."
  correct_answer: B
  comments:
    A: "A personagem não enfrenta um dilema moral; sua reflexão é sobre o tempo e a vida."
    B: "Saber que nunca envelhecerá e que não verá o oceano de novo expressa a consciência da finitude humana, tema central da filosofia contemporânea (existencialismo)."
    C: "O texto não discute os limites da linguagem para expressar a experiência."
    D: "Não há questionamento sobre os pressupostos da existência, mas sobre seu caráter limitado no tempo."
    E: "O texto não trata da possibilidade de conhecer objetivamente a realidade."

- id: 4
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 62
  question_elements:
    - question_text_title: TEXTO I
      question_text: >
        O empirismo moderno foi, em grande parte, condicionado por dois dogmas. Um deles é a crença em
        certa divisão fundamental entre verdades analíticas, ou fundadas em significados independentemente
        de questões de fato, e verdades sintéticas, ou fundadas em fatos. O outro dogma é o reducionismo:
        a crença de que todo enunciado significativo é equivalente a algum construto lógico sobre termos
        que se referem à experiência imediata.
      question_text_reference: >
        QUINE, W. V. O. Dois dogmas do empirismo. In: RYLE, G. et al. Ensaios. São Paulo: Abril Cultural, 1975.
    - question_text_title: TEXTO II
      question_text: >
        Teses: 1. Somente os enunciados que possuem conteúdo factual são teoricamente significativos;
        enunciados que não podem, em princípio, estar fundamentados pela experiência são carentes de significado.
        2. As ciências empíricas usam somente o conteúdo empírico da realidade. 3. A filosofia usa um conceito
        não empírico da realidade.
      question_text_reference: >
        CARNAP, R. **Pseudoproblemas na filosofia.** In: SCHLICK, M.; CARNAP, R.; POPPER, K. Coletânea de textos. São Paulo: Abril Cultural, 1975.
  statement: >
    Ao comparar os textos, conclui-se que eles apresentam posicionamentos filosóficos divergentes com relação ao
  answers:
    A: "estatuto epistemológico da linguagem."
    B: "alicerce estruturante da moralidade."
    C: "conteúdo essencial da metafísica."
    D: "princípio constitutivo da ontologia."
    E: "domínio reflexivo da estética."
  correct_answer: A
  comments:
    A: "Quine critica a distinção entre enunciados analíticos e sintéticos, e Carnap defende que só têm sentido os enunciados verificáveis pela experiência. Ambos discutem o que dá significado à linguagem, mas divergem sobre isso."
    B: "Nenhum dos textos trata fundamentos da moral."
    C: "Apenas o Texto II (Carnap) faz referência à metafísica, de modo indireto; o Texto I (Quine) discute o significado dos enunciados, não o conteúdo da metafísica."
    D: "A ontologia (estudo do ser) não é o ponto de divergência entre os autores."
    E: "Não há discussão sobre arte ou estética."

- id: 5
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 75
  question_elements:
    - question_text: >
        Os salões permitiam aos escritores da época do Iluminismo adentrar no universo dos poderosos.
        Figuras como as de Voltaire e Duclos exortavam seus “irmãos” a aproveitarem da mobilidade que
        era oferecida pela ordem social do Antigo Regime, juntando-se à elite. Nos últimos decênios do
        Ancien Régime, ele foi se tornando cada vez mais o reduto dos filósofos do Alto Iluminismo,
        que deixavam os cafés para os tipos inferiores de literário. Com efeito, os cafés se constituíram
        na antítese lógica dos salões. Eles eram abertos a todos, a um passo da rua. Como é possível
        constatar, salões e cafés constituem interessantes instituições do espaço público literário
        através das quais é possível vislumbrar as bases sociais nas quais se assentavam o Alto e o Baixo Iluminismo.
      question_text_reference: >
        HABERMAS, J. **Mudança estrutural da esfera pública: investigações quanto a uma categoria da sociedade burguesa.**
        Rio de Janeiro: Tempo Brasileiro, 1984 (adaptado).
  statement: >
    No período iluminista, os espaços sociais mencionados contribuíram para
  answers:
    A: "segregar pensadores e aumentar a circulação de ideias."
    B: "apoiar revolucionários e perseguir a nobreza local."
    C: "rejeitar poetisas e proibir a entrada de mulheres."
    D: "censurar cronistas e coibir o patrocínio editorial."
    E: "integrar artistas e ampliar o comércio urbano."
  correct_answer: A
  comments:
    A: "Salões (para os filósofos do Alto Iluminismo, ligados à elite) e cafés (abertos a todos) eram espaços diferentes para pensadores de diferentes posições sociais, e ambos serviam como espaços públicos de circulação de ideias."
    B: "Os salões buscavam a aproximação com os poderosos, e não a perseguição à nobreza; o texto também não fala de apoio a revolucionários."
    C: "O texto não menciona exclusão de poetisas ou de mulheres."
    D: "Eram espaços de debate, e não de censura; o texto não fala em coibir patrocínio editorial."
    E: "O texto não trata de comércio urbano nem de integração de artistas."

- id: 6
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 76
  question_elements:
    - question_text: >
        Resumamos os principais caracteres de um rizoma: diferentemente das árvores ou de suas raízes,
        o rizoma conecta um ponto qualquer com outro ponto qualquer e cada um de seus traços não remete
        necessariamente a traços de mesma natureza. Contra os sistemas centrados (e mesmo policentrados),
        de comunicação hierárquica e ligações preestabelecidas, o rizoma é um sistema a-centrado
        não hierárquico e não significante, sem general, sem memória organizadora ou autômato central,
        unicamente definido por uma circulação de estados.
      question_text_reference: >
        DELEUZE, G.; GUATTARI, F. **Mil platôs.** São Paulo: Editora 34, 1995 (adaptado).
  statement: >
    Qual elemento da cultura contemporânea se relaciona às características do conceito de rizoma, conforme descrito no texto?
  answers:
    A: "Estrutura fixa."
    B: "Lógica binária."
    C: "Controle homogêneo."
    D: "Uniformidade de opiniões."
    E: "Pluralidade de interações."
  correct_answer: E
  comments:
    A: "O rizoma é justamente o oposto de uma estrutura fixa: conecta qualquer ponto a qualquer outro."
    B: "A lógica binária é típica das árvores e raízes (estrutura hierárquica em que cada ponto se divide em dois); o rizoma a rejeita."
    C: "O rizoma não tem centro, general nem autômato central; portanto, não há controle homogêneo."
    D: "A ausência de centro e de hierarquia favorece a diversidade, e não a uniformidade de opiniões."
    E: "O rizoma é uma rede descentralizada e não hierárquica em que múltiplos pontos se conectam livremente, o que se relaciona à pluralidade de interações da cultura contemporânea (como na internet)."

- id: 7
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 78
  question_elements:
    - question_text: >
        A regra de ouro, popularmente conhecida pelo provérbio "Trate os outros como gostaria de ser tratado",
        é um dos princípios morais mais onipresentes. A noção subjacente, que apela para o senso ético mais básico,
        se expressa de uma forma ou de outra em praticamente todas as tradições religiosas, e poucos filósofos morais
        deixaram de invocar a regra ou pelo menos de tecer comentários a respeito da relação com seus próprios princípios.
      question_text_reference: >
        DUPRÉ, B. **50 grandes ideias da humanidade**. São Paulo: Planeta do Brasil, 2016.
  statement: >
    O princípio ético apresentado no texto, como elemento estruturante da vida em sociedade, se traduz pela seguinte formulação teórica:
  answers:
    A: "Doutrina teleológica."
    B: "Imperativo categórico."
    C: "Pensamento utilitarista."
    D: "Secularização inautêntica."
    E: "Raciocínio consequencialista."
  correct_answer: B
  comments:
    A: "A doutrina teleológica avalia a ação pelos fins ou propósitos; a regra de ouro não trata de finalidades, mas de reciprocidade."
    B: "O imperativo categórico de Kant manda agir segundo uma máxima que possa valer como lei universal; a regra de ouro expressa essa ideia de universalização e reciprocidade."
    C: "O utilitarismo avalia as ações pela maximização da felicidade coletiva, e não pela reciprocidade."
    D: "Não há relação com secularização; a regra de ouro aparece em várias tradições religiosas e seculares."
    E: "O consequencialismo julga as ações pelos seus resultados; a regra de ouro parte de um princípio que independe das consequências."

- id: 8
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 82
  question_elements:
    - question_text: >
        Bertrand Russell conta a história de um peru que descobrira, em sua primeira manhã na fazenda de perus,
        que fora alimentado às 9 da manhã. Contudo, ele não tirou conclusões apressadas. Esperou até recolher
        um grande número de observações do fato de que era alimentado às 9 da manhã e fez essas observações
        sob uma ampla variedade de circunstâncias, às quartas e quintas-feiras, em dias quentes e dias frios,
        em dias chuvosos e dias secos. A cada dia acrescentava uma outra proposição de observação à sua lista.
        Finalmente, sua consciência ficou satisfeita e ele concluiu. “Eu sou alimentado sempre às 9 da manhã”.
      question_text_reference: >
        CHALMERS, A. **O que é ciência, afinal?** São Paulo: Brasiliense, 1993 (adaptado).
  statement: >
    Qual tipo de raciocínio corresponde ao padrão de pensamento exibido pelo personagem do texto?
  answers:
    A: "Prático, porque recolhe evidências e recomenda ações."
    B: "Absoluto, porque busca confirmações e bloqueia refutações."
    C: "Indutivo, porque observa eventos particulares e infere leis universais."
    D: "Demonstrativo, porque encadeia premissas e extrai conclusões indubitáveis."
    E: "Analógico, porque compara diferentes situações e detecta elementos semelhantes."
  correct_answer: C
  comments:
    A: "O peru não recomenda nenhuma ação; apenas formula uma conclusão a partir de observações."
    B: "O raciocínio do peru não é absoluto: ele observa em diversas circunstâncias e generaliza, o que é passível de refutação (como a véspera de Natal)."
    C: "O peru parte de várias observações particulares (ser alimentado às 9h em muitos dias) e infere uma lei geral ('sempre às 9h'). É o raciocínio indutivo, tema central em Bacon e Hume."
    D: "O raciocínio demonstrativo (dedutivo) leva a conclusões necessárias a partir de premissas; a indução não garante a certeza da conclusão."
    E: "Não há comparação entre casos diferentes por semelhança, mas generalização a partir de repetições."

- id: 9
  test: enem_2024
  test_type: azul
  test_part: ch
  test_item: 90
  question_elements:
    - question_text: >
        Uma fábrica na qual os operários fossem, efetiva e integralmente, simples peças de máquinas executando
        cegamente as ordens da direção pararia em quinze minutos. O capitalismo só pode funcionar com a
        contribuição constante da atividade propriamente humana de seus subjugados que, ao mesmo tempo,
        tenta reduzir e desumanizar o mais possível.
      question_text_reference: >
        CASTORIADIS, C. **A instituição imaginária da sociedade.** Rio de Janeiro: Paz e Terra, 1982.
  statement: >
    O texto apresenta uma contradição interna do capitalismo caracterizada pela
  answers:
    A: "obsolescência associada ao uso da tecnologia."
    B: "orientação voltada à administração de conflitos."
    C: "alienação decorrente da organização do trabalho."
    D: "isonomia remanescente da geração de riquezas."
    E: "produtividade vinculada ao fortalecimento da autonomia."
  correct_answer: C
  comments:
    A: "O texto não trata de obsolescência tecnológica."
    B: "O texto não fala de administração de conflitos."
    C: "O capitalismo tenta reduzir o trabalhador a mera peça de máquina (desumanizar), mas depende da atividade humana para funcionar. Essa contradição decorre da alienação gerada pela organização do trabalho."
    D: "O texto não trata de igualdade na distribuição de riqueza."
    E: "O sistema tenta reduzir a autonomia do trabalhador, e não fortalecê-la."

- id: 10
  test: enem_2025
  test_type: azul
  test_part: ch
  test_item: 48
  question_elements:
    - question_text: >
        A credulidade dos ouvintes aumenta o descaramento do narrador, e o descaramento deste conquista-lhes a credulidade.
        A eloquência, quando levada a seu patamar mais alto, deixa pouco lugar à razão ou à reflexão, mas, dirigindo-se inteiramente
        à imaginação e aos afetos, cativa os ouvintes condescendentes e subjuga-lhes o entendimento.
      question_text_reference: >
        HUME, D. **Uma investigação sobre o entendimento humano e sobre os princípios da moral.** São Paulo: Edunesp, 2003.
  statement: >
    No contexto do século XVIII, o autor propõe uma reflexão radical acerca da arte da eloquência, restringindo-a ao
  answers:
    A: "sistema de crenças, conforme a proposta kantiana de objetividade do conhecimento."
    B: "campo dos absolutos, semelhante ao entendimento medieval dos Universais."
    C: "domínio da lógica, consoante a compreensão aristotélica nos Analíticos."
    D: "paradigma da racionalidade, alinhado ao modelo cartesiano de método."
    E: "âmbito da persuasão, análogo às críticas platônicas aos sofistas."
  correct_answer: E
  comments:
    A: "Kant trata da objetividade do conhecimento; Hume critica a eloquência por apelar à imaginação e aos afetos, e não por uma proposta kantiana."
    B: "Os Universais medievais são um debate sobre conceitos gerais; não têm relação com o tema da eloquência."
    C: "Na lógica dos Analíticos de Aristóteles, a razão é central; Hume diz que a eloquência deixa pouco lugar à razão."
    D: "O método cartesiano se baseia na razão e na evidência; a eloquência criticada por Hume age pela imaginação e pelos afetos."
    E: "Hume associa a eloquência à persuasão que subjuga o entendimento por meio de emoções, o que se aproxima da crítica de Platão aos sofistas, mestres de retórica que persuadem sem se comprometer com a verdade."

- id: 11
  test: enem_2025
  test_type: azul
  test_part: ch
  test_item: 50
  question_elements:
    - question_text: >
        O direito não é a justiça. O direito é o elemento do cálculo, é justo que haja um direito, mas a justiça é incalculável,
        ela exige que se calcule o incalculável; e as experiências aporéticas são experiências tão improváveis quanto necessárias
        da justiça, isto é, são momentos em que a decisão entre o justo e o injusto nunca é garantida por uma regra.
      question_text_reference: >
        DERRIDA, J. **Força de lei.** São Paulo: Martins Fontes, 2010 (adaptado).
  statement: >
    De acordo com o texto, ainda que estejam em desconformidade com o ordenamento jurídico, são exemplos de ação justa:
  answers:
    A: "Casos de desobediência civil."
    B: "Repressões do aparato estatal."
    C: "Conflitos de natureza intercontinental."
    D: "Manifestações do movimento sindical."
    E: "Mobilizações de agremiações estudantis."
  correct_answer: A
  comments:
    A: "Para Derrida, a justiça exige decisões que não se apoiam apenas nas regras do direito; a desobediência civil viola a lei, mas em nome de um ideal de justiça."
    B: "As repressões do aparato estatal são a aplicação (nem sempre justa) do direito, e não um exemplo de justiça contra a norma."
    C: "Conflitos entre continentes não têm relação com o argumento do texto."
    D: "O movimento sindical, em geral, atua dentro da lei e não exemplifica a divergência entre direito e justiça."
    E: "As mobilizações estudantis não são necessariamente contrárias ao ordenamento jurídico."

- id: 12
  test: enem_2025
  test_type: azul
  test_part: ch
  test_item: 55
  question_elements:
    - question_text: >
        A “invenção” dessa nova anatomia política não deve ser entendida como uma descoberta súbita.
        Mas como uma multiplicidade de processos muitas vezes mínimos, de origens diferentes,
        de localizações esparsas, que se recordam, que se repetem, ou se imitam, apoiam-se uns sobre os outros
        e esboçam aos poucos a fachada de um método geral. Encontramo-los em funcionamento nos colégios,
        muito cedo; mais tarde, nas escolas primárias, no espaço hospitalar e na organização militar.
      question_text_reference: >
        FOUCAULT, M. **Vigiar e punir.** Petrópolis: Vozes, 2011.
  statement: >
    O texto indica o seguinte aspecto da disciplina como ferramenta política:
  answers:
    A: "Expansão das técnicas de suplício."
    B: "Judicialização das relações de poder."
    C: "Dissolução das distinções de nobreza."
    D: "Capilarização das práticas de controle."
    E: "Espetacularização das medidas de penitência."
  correct_answer: D
  comments:
    A: "Para Foucault, a disciplina substitui o suplício (castigo espetacular e violento), e não o amplia."
    B: "O texto trata de técnicas disseminadas em várias instituições, e não de processos judiciais."
    C: "O texto não fala de dissolução de distinções de nobreza."
    D: "A 'anatomia política' aparece de forma difusa (colégios, escolas, hospitais, exército), em microprocessos que se espalham por toda a sociedade: é a capilarização do controle."
    E: "A disciplina moderna é discreta e cotidiana, ao contrário do espetáculo das punições públicas."

- id: 13
  test: enem_2025
  test_type: azul
  test_part: ch
  test_item: 60
  question_elements:
    - question_text: >
        Adam Smith via o açougueiro e o padeiro não só como indivíduos buscando seus interesses financeiros,
        mas como pessoas moralmente motivadas dentro de uma sociedade. A base da moral era a empatia e o julgamento,
        instaurando uma distinção entre o que queremos fazer e o que sentimos que devemos fazer.

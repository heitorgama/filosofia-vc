- id: 82
  test: enem_2019
  test_type: azul
  test_part: ch
  test_item: 58
  question_elements:
  - question_text: "De fato, não é porque o homem pode usar a vontade livre para pecar\
      \ que se deve supor que Deus a concedeu para isso. Há, portanto, uma razão pela\
      \ qual Deus deu ao homem esta característica, pois sem ela não poderia viver\
      \ e agir corretamente. Pode-se compreender, então, que ela foi concedida ao\
      \ homem para esse fim, considerando-se que se um homem a usa para pecar, recairão\
      \ sobre ele as punições divinas. Ora, isso seria injusto se a vontade livre\
      \ tivesse sido dada ao homem não apenas para agir corretamente, mas também para\
      \ pecar. Na verdade, por que deveria ser punido aquele que usasse sua vontade\
      \ para o fim para o qual ela lhe foi dada?"
    question_text_reference: "AGOSTINHO. **O livre-arbítrio.** In: MARCONDES, D. Textos\
      \ básicos de ética. Rio de Janeiro: Jorge Zahar, 2008."
  statement: "Nesse texto, o filósofo cristão Agostinho de Hipona sustenta que a punição\
    \ divina tem como fundamento o(a)"
  answers:

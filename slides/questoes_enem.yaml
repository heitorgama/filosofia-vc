    question_text_reference: "KANT, I. **Crítica da razão prática.** Lisboa: Edições\
      \ 70, s/d (adaptado)."
  - question_text_title: "TEXTO II"
    question_text: "Duas coisas admiro: a dura lei cobrindo-me e o estrelado céu dentro\

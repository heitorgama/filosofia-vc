      \ pedaços de comida trancados dentro de um armário. A um segundo chimpanzé era\
      \ dada, então, a oportunidade de liberar a comida, porém, sem usufruir dela.\
      \ Em aproximadamente 80% das vezes, eles tomaram a decisão mais caridosa e liberaram\
      \ o alimento para o outro chimpanzé."
    question_text_reference: "**Estudos mostram caridade no mundo animal.** Disponível\
      \ em: http://revistagalileu.globo.com. Acesso em: 17 out. 2021."
  statement: "Considerando nossa relação com outros, o experimento envolvendo os\
    \ chimpanzés ilustra qual tipo de comportamento moral humano?"
  answers:
    A: "Hedonista, anseia o prazer pessoal."
    B: "Altruísta, promove o bem-estar imparcial."
    C: "Retributivo, busca um retorno equivalente."
    D: "Deontológico, cumpre uma obrigação formal."
    E: "Meritocrático, valoriza o merecimento individual."
  correct_answer: B
  comments:

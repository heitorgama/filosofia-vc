- id: 30
  test: enem_2025_2apl
  test_type: azul
  test_part: ch
  test_item: 69
  question_elements:
    - question_text: >
        A ontologia como fundamento da ética foi o ponto de vista original da filosofia. A
        separação das duas, que é a separação entre o reino “objetivo” e o “subjetivo”, é
        o destino moderno. Sua re-união, caso seja possível, só poderá ser alcançada a partir
        do lado “objetivo”; quer dizer: por uma revisão da ideia de natureza. Só uma ética
        fundada na amplitude do ser, e não apenas na singularidade ou na peculiaridade do
        ser humano, é que pode ser de importância no universo das coisas. Mesmo que seja
        feita uma exigência extra-humana para o comportamento humano, permanece de pé
        o fato de que uma ética que não mais se baseie sobre a divindade tem que se
        fundamentar em um princípio que possa ser descoberto na natureza das coisas, para
        que não seja vítima do subjetivismo ou de outras formas de relativismo.
      question_text_reference: >
        JONAS, H. O princípio vida: fundamentos para uma biologia filosófica. Petrópolis:
        Vozes, 2004 (adaptado).
  statement: >
    A fundamentação ontológica da ética proposta pelo autor encontra suporte na
  answers:
    A: "afirmação da autoridade religiosa."
    B: "satisfação de interesses individuais."
    C: "formação do pragmatismo utilitarista."
    D: "compreensão da totalidade universal."
    E: "superação do modelo racionalista."
  correct_answer: D
  comments:
    A: "Jonas afirma que uma ética que não se baseia mais na divindade precisa de outro fundamento."
    B: "O autor quer evitar o subjetivismo, ou seja, uma ética baseada apenas em interesses individuais."
    C: "O pragmatismo utilitarista não é mencionado."
    D: "Uma ética fundada na 'amplitude do ser', na natureza das coisas, e não apenas no ser humano, depende da compreensão da totalidade do universo."
    E: "O texto não propõe superar o racionalismo; critica a separação moderna entre sujeito e objeto."


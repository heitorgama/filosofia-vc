- id: 87
  test: enem_2019
  test_type: azul
  test_part: ch
  test_item: 64
  question_elements:
  - question_text: "A lenda diz que, em um belo dia ensolarado, Newton estava relaxando\
      \ sob uma macieira. Pássaros gorjeavam em suas orelhas. Havia uma brisa gentil.\
      \ Ele cochilou por alguns minutos. De repente, uma maçã caiu sobre a sua cabeça\
      \ e ele acordou com um susto. Olhou para cima. “Com certeza um pássaro ou um\
      \ esquilo derrubou a maçã da árvore”, supôs. Mas não havia pássaros ou esquilos\
      \ na árvore por perto. Ele, então, pensou: “Apenas alguns minutos antes, a maçã\
      \ estava pendurada na árvore. Nenhuma força externa fez ela cair. Deve haver\
      \ alguma força subjacente que causa a queda das coisas para a terra”."
    question_text_reference: "SILVA, C. C.; MARTINS, R. A. **Estudos de história e\
      \ filosofia das ciências.** São Paulo: Livraria da Física, 2006 (adaptado)."
  statement: "Em contraponto a uma interpretação idealizada, o texto aponta para a\
    \ seguinte dimensão fundamental da ciência moderna:"
  answers:
    A: "Falsificação de teses."
    B: "Negação da observação."
    C: "Proposição de hipóteses."
    D: "Contemplação da natureza."
    E: "Universalização de conclusões."
  correct_answer: C
  comments:
    A: "A falsificação de teses é um conceito de Popper; o texto não trata disso."
    B: "Newton parte da observação (a maçã caindo)."
    C: "Newton não se limita a observar: propõe uma hipótese (deve haver uma força subjacente), o que mostra que a ciência moderna trabalha com hipóteses e não apenas com a coleta de dados."
    D: "A ciência moderna não se limita à contemplação da natureza; ela formula e testa hipóteses."
    E: "O texto não trata de universalização das conclusões."


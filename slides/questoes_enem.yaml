  test_part: ch
  test_item: 45
  question_elements:
  - question_text: "Quando Édipo nasceu, seus pais, Laio e Jocasta, os reis de Tebas,\
      \ foram informados de uma profecia na qual o filho mataria o pai e se casaria\
      \ com a mãe. Para evitá-la, ordenaram a um criado que matasse o menino. Porém,\
      \ penalizado com a sorte de Édipo, ele o entregou a um casal de camponeses que\
      \ morava longe de Tebas para que o criasse. Édipo soube da profecia quando se\
      \ tornou adulto. Saiu então da casa de seus pais para evitar a tragédia. Eis\
      \ que, perambulando pelos caminhos da Grécia, encontrou-se com Laio e seu séquito,\
      \ que, insolentemente, ordenou que saísse da estrada. Édipo reagiu e matou todos\
      \ os integrantes do grupo, sem saber que entre eles estava seu verdadeiro pai.\
      \ Continuou a viagem até chegar a Tebas, dominada por uma Esfinge. Ela decifrou\
      \ o enigma da Esfinge, tornou-se rei de Tebas e casou-se com a rainha, Jocasta,\
      \ a mãe que desconhecia."
    question_text_reference: "Disponível em: http://www.culturabrasil.org. Acesso\
      \ em: 28 ago. 2010 (adaptado)."
  statement: "No mito Édipo Rei, são dignos de destaque os temas do destino e do determinismo.\

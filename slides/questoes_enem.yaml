- id: 34
  test: enem_2012
  test_type: azul
  test_part: ch
  test_item: 28
  question_elements:
    - question_text_title: TEXTO I
      question_text: >
        Anaxímenes de Mileto disse que o ar é o elemento originário de tudo o que existe,
        existiu e existirá, e que outras coisas provêm de sua descendência. Quando o ar se
        dilata, transforma-se em fogo, ao passo que os ventos são ar condensado. As nuvens
        formam-se a partir do ar por feltragem e, ainda mais condensadas, transformam-se
        em água. A água, quando mais condensada, transforma-se em terra, e quando
        condensada ao máximo possível, transforma-se em pedras.
      question_text_reference: >
        BURNET, J. **A aurora da filosofia grega.** Rio de Janeiro: PUC-Rio, 2006 (adaptado).
    - question_text_title: TEXTO II
      question_text: >
        Basílio Magno, filósofo medieval, escreveu: “Deus, como criador de todas as coisas,
        está no princípio do mundo e dos tempos. Quão parcas de conteúdo se nos apresentam,
        em face desta concepção, as especulações contraditórias dos filósofos, para os quais
        o mundo se origina, ou de algum dos quatro elementos, como ensinam os Jônios, ou
        dos átomos, como julga Demócrito. Na verdade, dão a impressão de quererem ancorar
        o mundo numa teia de aranha.”
      question_text_reference: >
        GILSON, E.; BOEHNER, P. **História da Filosofia Cristã.** São Paulo: Vozes, 1991 (adaptado).
  statement: >
    Filósofos dos diversos tempos históricos desenvolveram teses para explicar a origem do
    universo, a partir de uma explicação racional. As teses de Anaxímenes, filósofo grego
    antigo, e de Basílio, filósofo medieval, têm em comum na sua fundamentação teorias que
  answers:
    A: "eram baseadas nas ciências da natureza."
    B: "refutavam as teorias de filósofos da religião."
    C: "tinham origem nos mitos das civilizações antigas."
    D: "postulavam um princípio originário para o mundo."
    E: "defendiam que Deus é o princípio de todas as coisas."
  correct_answer: D
  comments:
    A: "Basílio Magno é um pensador cristão e sua explicação parte da fé, e não das ciências da natureza."
    B: "Apenas Basílio critica outras teorias; Anaxímenes não refuta filósofos da religião."
    C: "Anaxímenes busca uma explicação racional da natureza, distinta dos mitos; e Basílio se baseia na doutrina cristã."
    D: "Anaxímenes propõe o ar como princípio (arché) de tudo; Basílio propõe Deus. Em ambos, há a postulação de um princípio originário do mundo."
    E: "Só Basílio defende que Deus é o princípio de todas as coisas; Anaxímenes defende o ar."


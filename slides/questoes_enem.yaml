  test_item: 86
  question_elements:
  - question_text: "A filosofia é como uma árvore, cujas raízes são a metafísica;\
      \ o tronco, a física, e os ramos que saem do tronco são todas as outras ciências,\
      \ que se reduzem a três principais: a medicina, a mecânica e a moral, entendendo\
      \ por moral a mais elevada e a mais perfeita porque pressupõe um saber integral\
      \ das outras ciências, e é o último grau da sabedoria."
    question_text_reference: "DESCARTES, R. **Princípios da filosofia.** Lisboa: Edições\
      \ 70, 1997 (adaptado)."
  statement: "Essa construção alegórica de Descartes, acerca da condição epistemológica\
    \ da filosofia, tem como objetivo"
  answers:
    A: "sustentar a unidade essencial do conhecimento."
    B: "refutar o elemento fundamental das crenças."
    C: "impulsionar o pensamento especulativo."
    D: "recepcionar o método experimental."
    E: "incentivar a suspensão dos juízos."
  correct_answer: A
  comments:
    A: "Na metáfora da árvore, metafísica, física e as demais ciências formam um único sistema de conhecimento, com raízes, tronco e ramos: é a unidade essencial do saber."
    B: "Descartes não refuta o elemento fundamental das crenças; ao contrário, busca fundamento sólido."
    C: "O texto propõe uma organização sistemática, e não incentivo à especulação."
    D: "O método experimental não é o objetivo da alegoria."
    E: "A suspensão de juízos (ceticismo) é apenas o começo do método cartesiano, e não o objetivo da metáfora."

- id: 96
  test: enem_2014
  test_type: azul
  test_part: ch
  test_item: 29
  question_elements:
  - question_text: "A filosofia encontra-se escrita neste grande livro que continuamente\
      \ se abre perante nossos olhos (isto é, o universo), que não se pode compreender\
      \ antes de entender a língua e conhecer os caracteres com os quais está escrito.\
      \ Ele está escrito em língua matemática, os caracteres são triângulos, circunferências\
      \ e outras figuras geométricas, sem cujos meios é impossível entender humanamente\
      \ as palavras; sem eles, vagamos perdidos dentro de um obscuro labirinto."
    question_text_reference: "GALILEI, G. O ensaiador. **Os pensadores.** São Paulo:\
      \ Abril Cultural, 1978."
  statement: "No contexto da Revolução Científica do século XVII, assumir a posição\
    \ de Galileu significava defender a:"
  answers:
    A: "continuidade do vínculo entre ciência e fé dominante na Idade Média."
    B: "necessidade de o estudo linguístico ser acompanhado do exame matemático."
    C: "oposição da nova física quantitativa aos pressupostos da filosofia escolástica."
    D: "importância da independência da investigação científica pretendida pela Igreja."
    E: "inadequação da matemática para elaborar uma explicação racional da natureza."
  correct_answer: C
  comments:
    A: "Galileu rompe com a subordinação da ciência à fé."
    B: "O texto diz que a linguagem do universo é matemática, e não que o estudo linguístico deve ser acompanhado da matemática."
    C: "Ao afirmar que a natureza é escrita em linguagem matemática, Galileu defende uma física quantitativa, contra os pressupostos qualitativos da filosofia escolástica."
    D: "A independência da investigação científica não era pretendida pela Igreja, que condenou Galileu."
    E: "Galileu defende a adequação da matemática para explicar a natureza."

- id: 97
  test: enem_2013
  test_type: azul
  test_part: ch
  test_item: 36
  question_elements:
  - question_text: "Até hoje admitia-se que nosso conhecimento se devia regular pelos\
      \ objetos; porém, todas as tentativas para descobrir, mediante conceitos, algo\
      \ que ampliasse nosso conhecimento, malogravam-se com esse pressuposto. Tentemos,\
      \ pois, uma vez, experimentar se não se resolverão melhor as tarefas da metafísica,\
      \ admitindo que os objetos se deveriam regular pelo nosso conhecimento."
    question_text_reference: "KANT, I. **Crítica da razão pura.** Lisboa: Calouste-Gulbenkian,\
      \ 1994 (adaptado)."
  statement: "O trecho em questão é uma referência ao que ficou conhecido como revolução\
    \ copernicana na filosofia. Nele, confrontam-se duas posições filosóficas que"
  answers:
    A: "assumem pontos de vista opostos acerca da natureza do conhecimento."
    B: "defendem que o conhecimento é impossível, restando-nos somente o ceticismo."
    C: "revelam a relação de interdependência entre os dados da experiência e a reflexão\
      \ filosófica."
    D: "apostam, no que diz respeito às tarefas da filosofia, na primazia das ideias\
      \ em relação aos objetos."
    E: "refutam-se mutuamente quanto à natureza do nosso conhecimento e são ambas\
      \ recusadas por Kant."
  correct_answer: A
  comments:
    A: "Antes de Kant, supunha-se que o conhecimento se regulava pelos objetos; Kant propõe que os objetos se regulam pelo nosso conhecimento. São dois pontos de vista opostos sobre a natureza do conhecimento."
    B: "Kant não defende o ceticismo, pois busca fundamentar o conhecimento possível."
    C: "O trecho contrapõe duas posições, e não trata da interdependência entre experiência e reflexão."
    D: "Só a posição de Kant dá primazia ao sujeito; a outra dá primazia ao objeto."
    E: "Kant adota a segunda posição (objetos regulados pelo conhecimento), e não a recusa."

- id: 98
  test: enem_2016_2apl
  test_type: branca
  test_part: ch
  test_item: 8
  question_elements:
  - question_text: "Estamos, pois, de acordo quando, ao ver algum objeto, dizemos:\
      \ “Este objeto que estou vendo agora tem tendência para assemelhar-se a um outro\
      \ ser, mas, por ter defeitos, não consegue ser tal como o ser em questão, e\
      \ lhe é, pelo contrário, inferior”. Assim, para podermos fazer estas reflexões,\
      \ é necessário que antes tenhamos tido ocasião de conhecer esse ser de que se\
      \ aproxima o dito objeto, ainda que imperfeitamente."
    question_text_reference: "PLATÃO. **Fédon.** São Paulo: Abril Cultural, 1972."
  statement: "Na epistemologia platônica, conhecer um determinado objeto implica"
  answers:
    A: "estabelecer semelhanças entre o que é observado em momentos distintos."
    B: "comparar o objeto observado com uma descrição detalhada dele."
    C: "descrever corretamente as características do objeto observado."
    D: "fazer correspondência entre o objeto observado e seu ser."
    E: "identificar outro exemplar idêntico ao observado."
  correct_answer: D
  comments:
    A: "O texto compara o objeto com um modelo perfeito, e não observações em momentos diferentes."
    B: "Não se trata de comparar com uma descrição do objeto."
    C: "Descrever características é insuficiente: para Platão, conhecer implica reconhecer a Forma (ideia) da qual o objeto é cópia imperfeita."
    D: "Para conhecer um objeto sensível, é preciso ter conhecido antes o ser (a Forma) do qual ele é uma cópia imperfeita, isto é, fazer a correspondência entre o objeto e seu ser."
    E: "Os objetos sensíveis nunca são idênticos entre si, e a comparação se faz com a Forma perfeita."

- id: 99
  test: enem_2017
  test_type: azul
  test_part: ch
  test_item: 48
  question_elements:
  - question_text: "A moralidade, Bentham exortava, não é uma questão de agradar a\
      \ Deus, muito menos de fidelidade a regras abstratas. A moralidade é a tentativa\
      \ de criar a maior quantidade de felicidade possível neste mundo. Ao decidir\
      \ o que fazer, deveríamos, portanto, perguntar qual curso de conduta promoveria\
      \ a maior quantidade de felicidade para todos aqueles que serão afetados."
    question_text_reference: "RACHELS, J. **Os elementos da filosofia moral.** Barueri-SP:\
      \ Manole, 2006."
  statement: "Os parâmetros da ação indicados no texto estão em conformidade com uma"
  answers:
    A: "fundamentação científica de viés positivista."
    B: "convenção social de orientação normativa."
    C: "transgressão comportamental religiosa."
    D: "racionalidade de caráter pragmático."
    E: "inclinação de natureza passional."
  correct_answer: D

- id: 100
  test: enem_2024_2apl
  test_type: azul
  test_part: ch
  test_item: 53
  question_elements:
  - question_text: "Ubuntu é um sistema de crenças, uma epistemologia, uma ética coletiva\
      \ e uma filosofia humanista espiritual do sul da África. É mais um fundamento\
      \ ético coletivo do que qualquer outra coisa, embora também seja considerado\
      \ uma forma de filosofia e epistemologia africanas nativas. É uma forma ética\
      \ de conhecer e de ser em comunidade. É muito menos um conceito abstrato do\
      \ que uma expressão coletiva cotidiana de experiências vividas, centradas em\
      \ uma ética comunitária do que significa ser humano. Ubuntu é uma abreviação\
      \ de um provérbio da África do Sul: uma pessoa é uma pessoa por meio de seu\
      \ relacionamento com outros."
    question_text_reference: "SWANSON, D. **Ubuntu, uma alternativa ecopolítica à\
      \ globalização econômica neoliberal.** IHU Revista do Instituto Humanitas Unisinos,\
      \ n. 353, dez. 2010."
  statement: "A perspectiva filosófica africana apresentada no texto contrasta com\
    \ as formulações éticas da tradição eurocêntrica porque"
  answers:
    A: "destaca os padrões de identidade."
    B: "preconiza as condições de liberdade."
    C: "ressalta os atributos de individualidade."
    D: "enfatiza os elementos de racionalidade."
    E: "valoriza os vínculos de intersubjetividade."
  correct_answer: E


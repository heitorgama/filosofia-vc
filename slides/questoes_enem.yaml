      \ materiais, negativas e positivas, defesa e segurança, conservação e engrandecimento,\
      \ de outro modo irrealizáveis. Mas o seu fim essencial é espiritual, isto é,\
      \ deve promover a virtude e, consequentemente, a felicidade dos súditos mediante\
      \ a ciência."
    question_text_reference: "ARISTÓTELES. **A política.** São Paulo: Martins Fontes,\
      \ 2006 (adaptado)."
  statement: "Segundo o autor, é função do Estado garantir o(a)"
  answers:
    A: "justiça divina, pregando a salvação eterna dos fiéis."
    B: "soberania, respeitando a autonomia dos três poderes."
    C: "propriedade privada, protegendo o direito natural inalienável."
    D: "vida ética, proporcionando a formação moral dos cidadãos."
    E: "direito de resistência, suprimindo governos considerados impopulares."
  correct_answer: D
  comments:
    A: "Pregar a salvação eterna não é função do Estado para Aristóteles."
    B: "A separação dos três poderes é ideia de Montesquieu, moderna, e não de Aristóteles."
    C: "A proteção da propriedade e do direito natural inalienável é uma ideia de Locke."
    D: "Para Aristóteles, o fim essencial do Estado é espiritual: promover a virtude e a felicidade dos cidadãos, isto é, a vida ética e a formação moral."
    E: "O direito de resistência a governos também é ideia moderna (Locke), e não aristotélica."

- id: 68

    C: "O texto não menciona desapego."
    D: "Não há referência a sacrifícios."
    E: "O texto não menciona o Velho Testamento."

- id: 83
  test: enem_2019
  test_type: azul
  test_part: ch
  test_item: 65
  question_elements:
  - question_text: "Para Maquiavel, quando um homem decide dizer a verdade pondo em\
      \ risco a própria integridade física, tal resolução diz respeito apenas a sua\
      \ pessoa. Mas se esse mesmo homem é um chefe de Estado, os critérios pessoais\
      \ não são mais adequados para decidir sobre ações cujas consequências se tornam\
      \ tão amplas, já que o prejuízo não será apenas individual, mas coletivo. Nesse\
      \ caso, conforme as circunstâncias e os fins a serem atingidos, pode-se decidir\
      \ que o melhor para o bem comum seja mentir."
    question_text_reference: "ARANHA, M. L. **Maquiavel: a lógica da força.**São Paulo:\
      \ Moderna, 2006 (adaptado)."
  statement: "O texto aponta uma inovação na teoria política na época moderna expressa\
    \ na distinção entre"
  answers:
    A: "idealidade e efetividade da moral."
    B: "nulidade e preservabilidade da liberdade."
    C: "ilegalidade e legitimidade do governante."
    D: "verificabilidade e possibilidade da verdade."
    E: "objetividade e subjetividade do conhecimento."
  correct_answer: A
  comments:
    A: "Maquiavel separa o que a moral prega (idealidade, como se deveria agir) do que é eficaz para o governante (efetividade, como se age de fato): a verdade pessoal pode ser sacrificada ao bem comum."
    B: "O texto não trata da liberdade."
    C: "O texto não distingue legalidade e legitimidade."
    D: "O texto não discute a verificabilidade da verdade."
    E: "O texto não trata de teoria do conhecimento."

- id: 84
  test: enem_2019
  test_type: azul
  test_part: ch
  test_item: 67
  question_elements:
  - question_text_title: "TEXTO I"
    question_text: "Considero apropriado deter-me algum tempo na contemplação deste\
      \ Deus todo perfeito, ponderar totalmente à vontade seus maravilhosos atributos,\
      \ considerar, admirar e adorar a incomparável beleza dessa imensa luz."
    question_text_reference: "DESCARTES, R. **Meditações.** São Paulo: Abril Cultural,\
      \ 1980."
  - question_text_title: "TEXTO II"
    question_text: "Qual será a forma mais razoável de entender como é o mundo? Existirá\
      \ alguma boa razão para acreditar que o mundo foi criado por uma divindade todo-poderosa?\
      \ Não podemos dizer que a crença em Deus é “apenas” uma questão de fé."
    question_text_reference: "RACHELS, J. **Problemas da filosofia.** Lisboa: Gradiva,\
      \ 2009."
  statement: "Os textos abordam um questionamento da construção da modernidade que\
    \ defende um modelo"
  answers:
    A: "centrado na razão humana."
    B: "baseado na explicação mitológica."
    C: "fundamentado na ordenação imanentista."
    D: "focado na legitimação contratualista."
    E: "configurado na percepção etnocêntrica."
  correct_answer: A
  comments:
    A: "Descartes usa a razão para provar a existência de Deus; Rachels questiona se a crença em Deus é apenas fé. Em ambos, a razão humana é critério do conhecimento, o que marca a modernidade."
    B: "Os textos buscam justificativas racionais, e não a explicação mitológica."
    C: "Nos textos, Deus é transcendente e criador, o que se opõe à imanência."
    D: "O contratualismo é uma teoria política, que não é abordada nos textos."
    E: "O etnocentrismo não é o tema dos textos."

- id: 85
  test: enem_2019
  test_type: azul
  test_part: ch
  test_item: 74
  question_elements:
  - question_text: "Penso que não há um sujeito soberano, fundador, uma forma universal\
      \ de sujeito que poderíamos encontrar em todos os lugares. Penso, pelo contrário,\
      \ que o sujeito se constitui através das práticas de sujeição ou, de maneira\
      \ mais autônoma, através de práticas de liberação, de liberdade, como na Antiguidade\
      \ — a partir, obviamente, de um certo número de regras, de estilos, que podemos\
      \ encontrar no meio cultural."
    question_text_reference: "FOUCAULT, M. **Ditos e escritos V: ética, sexualidade,\
      \ política.**Rio de Janeiro: Forense Universitária, 2004."
  statement: "O texto aponta que a subjetivação se efetiva numa dimensão"
  answers:
    A: "legal, pautada em preceitos jurídicos."
    B: "racional, baseada em pressupostos lógicos."
    C: "contingencial, processada em interações sociais."
    D: "transcendental, efetivada em princípios religiosos."
    E: "essencial, fundamentada em parâmetros substancialistas."
  correct_answer: C
  comments:
    A: "O texto não trata de preceitos jurídicos."
    B: "Foucault nega um sujeito universal fundado na razão; o sujeito se constitui em práticas."
    C: "Para Foucault, o sujeito se constitui historicamente em práticas de sujeição ou de liberdade, no meio cultural e em interações sociais, sem essência prévia."
    D: "Foucault nega uma fundação transcendental do sujeito."
    E: "O texto nega um sujeito fundador universal e essencial."

- id: 86
  test: enem_2019
